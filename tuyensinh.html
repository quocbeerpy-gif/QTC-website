<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HRCGroup – CRM Tuyển sinh & CTV</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#eef1ed;--cd:#fff;--tx:#16231f;--mu:#61706a;--pr:#0b6b5d;--pt:#fff;--ac:#e2a11f;--bd:#d8dfd9;--er:#b42318;--sf:#f6f8f5}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1614;--cd:#172320;--tx:#e6efe9;--mu:#93a59c;--pr:#3fbfa8;--pt:#08201b;--ac:#f0b544;--bd:#26352f;--er:#ff8a80;--sf:#1d2b27}}
:root[data-theme="dark"]{--bg:#0f1614;--cd:#172320;--tx:#e6efe9;--mu:#93a59c;--pr:#3fbfa8;--pt:#08201b;--ac:#f0b544;--bd:#26352f;--er:#ff8a80;--sf:#1d2b27}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 "Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--pr);color:var(--pt);display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:10px 16px}
header h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.2px;flex:1;min-width:150px}
header h1 small{display:block;font-weight:400;font-size:12px;opacity:.85}
header select{background:transparent;color:inherit;border:1px solid currentColor;border-radius:6px;padding:6px 8px;font:inherit;max-width:100%}
header select option{color:#16231f}
nav{display:flex;gap:4px;padding:8px 12px 0;overflow-x:auto;border-bottom:1px solid var(--bd);background:var(--cd)}
nav button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;font:inherit;color:var(--mu);cursor:pointer;white-space:nowrap}
nav button.on{color:var(--tx);border-color:var(--ac);font-weight:600}
main{padding:16px;max-width:1200px;margin:0 auto}
h3{margin:0 0 10px;font-size:16px}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.k{background:var(--cd);border:1px solid var(--bd);border-radius:8px;padding:12px 14px}
.k span{color:var(--mu);font-size:13px}.k b{display:block;font-size:22px;margin-top:2px}
.pn{background:var(--cd);border:1px solid var(--bd);border-radius:8px;padding:14px;margin-bottom:16px}
.br{display:grid;grid-template-columns:110px 1fr 30px;gap:10px;align-items:center;margin:6px 0;font-size:14px}
.br i{display:block;height:12px;background:var(--pr);border-radius:3px;min-width:2px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--bd);white-space:nowrap}
th{color:var(--mu);font-weight:500}
.tb{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
input,select.f{font:inherit;color:var(--tx);background:var(--cd);border:1px solid var(--bd);border-radius:6px;padding:9px 10px;min-width:0}
button.b,.box button{font:inherit;background:var(--pr);color:var(--pt);border:0;border-radius:6px;padding:9px 14px;cursor:pointer;font-weight:600}
button.g{background:transparent!important;color:var(--tx)!important;border:1px solid var(--bd)!important}
button.s{padding:4px 9px;font-size:13px}
.bd{display:flex;gap:10px;overflow-x:auto;align-items:flex-start;padding-bottom:8px}
.col{flex:0 0 230px;background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:8px;min-height:120px}
.col h4{margin:2px 4px 8px;font-size:13px;display:flex;justify-content:space-between}
.col h4 span{color:var(--mu)}
.cd{background:var(--cd);border:1px solid var(--bd);border-left:3px solid var(--ac);border-radius:6px;padding:9px 10px;margin-bottom:8px;font-size:14px}
.cd select{width:100%;margin-top:6px;font:inherit;font-size:13px;background:var(--cd);color:var(--tx);border:1px solid var(--bd);border-radius:5px;padding:4px}
.mu{color:var(--mu);font-size:13px}
.tg{display:inline-block;padding:1px 8px;border-radius:10px;background:var(--sf);border:1px solid var(--bd);font-size:12px;margin-top:4px}
.x{background:none;border:0;color:var(--er);cursor:pointer;font:inherit;font-size:12px;padding:6px 0 0}
.gl{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
#md{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9;align-items:center;justify-content:center;padding:16px}
#md.on{display:flex}
.box{background:var(--cd);border-radius:10px;padding:18px;width:100%;max-width:400px;display:grid;gap:10px}
.box h3{margin:0}.box input,.box select{width:100%;font:inherit;color:var(--tx);background:var(--cd);border:1px solid var(--bd);border-radius:6px;padding:9px 10px}
.row{display:flex;gap:8px;justify-content:flex-end}
#ts{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:10;max-width:90%}
#ts.on{opacity:1}
footer{color:var(--mu);font-size:12px;text-align:center;padding:8px 16px 24px}
.hb{background:none;border:1px solid currentColor;color:inherit;border-radius:6px;padding:4px 10px;cursor:pointer;font:inherit;font-size:13px}
</style>
</head>
<body>
<header>
  <h1>HRCGroup<small>CRM Tuyển sinh & Cộng tác viên</small></h1>
  <select id="who" onchange="login(this.value)" aria-label="Vai trò"></select>
</header>
<nav id="nav"></nav>
<main id="main"></main>
<footer>Bản demo: dữ liệu đồng bộ qua Firebase, chưa có đăng nhập thật. Không nhập dữ liệu thí sinh thật vào bản này.</footer>
<div id="md"></div><div id="ts"></div>
<script>
const ST=["Mới","Đã liên hệ","Quan tâm","Đã nộp hồ sơ","Trúng tuyển","Nhập học","Từ chối"];
const MJ=["Quản trị kinh doanh","Công nghệ thông tin","Kế toán","Ngôn ngữ Anh","Điều dưỡng","Marketing"];
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=n=>Number(n||0).toLocaleString("vi-VN")+"đ";
let S={ctv:[],leads:[],fee:{apply:200000,enroll:1000000}},me={role:"admin"},tab="dash",Q="",dl=0;

const fail=e=>toast("Không lưu được: "+(e.code||e.message));
function toast(m){const t=$("ts");t.textContent=m;t.className="on";clearTimeout(toast.t);toast.t=setTimeout(()=>t.className="",2600)}
const code=id=>(S.ctv.find(c=>c.id==id)||{code:"—"}).code;
const vis=()=>me.role=="admin"?S.leads:S.leads.filter(l=>l.ctv==me.id);
function cm(id){const L=S.leads.filter(l=>l.ctv==id),ap=L.filter(l=>l.st>=3&&l.st<=5).length,en=L.filter(l=>l.st==5).length,t=ap*S.fee.apply+en*S.fee.enroll,p=(S.ctv.find(c=>c.id==id)||{}).paid||0;return{n:L.length,ap,en,t,p,r:t-p}}

window.App={
 data(k,v){if(k=="cfg")S.fee=v.fee||S.fee;else S[k]=v;if(me.role=="ctv"&&!S.ctv.some(c=>c.id==me.id))me={role:"admin"};const a=document.activeElement;if(!(a&&a.tagName=="INPUT"&&$("main").contains(a)))R()},
 err(m){$("main").innerHTML=`<div class="pn"><h3>Chưa kết nối được Firebase</h3><p class="mu">${esc(m)}</p></div>`}
};
function login(v){me=v=="admin"?{role:"admin"}:{role:"ctv",id:+v};tab=me.role=="admin"?"dash":"leads";R()}
function R(){
  $("who").innerHTML=`<option value="admin">Admin – Ban tuyển sinh</option>`+S.ctv.map(c=>`<option value="${c.id}">${esc(c.name)} (${c.code})</option>`).join("");
  $("who").value=me.role=="admin"?"admin":me.id;
  const T=me.role=="admin"?[["dash","Tổng quan"],["leads","Hồ sơ"],["ctv","Cộng tác viên"],["set","Cài đặt"]]:[["leads","Hồ sơ của tôi"],["my","Hoa hồng"]];
  $("nav").innerHTML=T.map(([k,n])=>`<button class="${k==tab?"on":""}" onclick="tab='${k}';R()">${n}</button>`).join("");
  $("main").innerHTML=V[tab]();
}
const kp=(a,b)=>`<div class="k"><span>${a}</span><b>${b}</b></div>`;

const V={
dash(){
  const L=S.leads,n=L.length,en=L.filter(l=>l.st==5).length,tot=S.ctv.reduce((a,c)=>a+cm(c.id).t,0);
  const cnt=ST.map((_,i)=>L.filter(l=>l.st==i).length),mx=Math.max(1,...cnt);
  const rk=S.ctv.map(c=>({c,...cm(c.id)})).sort((a,b)=>b.en-a.en||b.n-a.n);
  return`<div class="kp">${kp("Tổng hồ sơ",n)}${kp("Đã nhập học",en)}${kp("Tỷ lệ nhập học",n?Math.round(en/n*100)+"%":"0%")}${kp("Hoa hồng phát sinh",fmt(tot))}</div>
  <div class="pn"><h3>Phễu tuyển sinh</h3>${ST.map((s,i)=>`<div class="br"><span>${s}</span><i style="width:${cnt[i]/mx*100}%"></i><b>${cnt[i]}</b></div>`).join("")}</div>
  <div class="pn"><h3>Xếp hạng cộng tác viên</h3><div class="tw"><table><tr><th>CTV</th><th>Hồ sơ</th><th>Đã nộp</th><th>Nhập học</th><th>Hoa hồng</th></tr>
  ${rk.map(r=>`<tr><td>${esc(r.c.name)}</td><td>${r.n}</td><td>${r.ap}</td><td>${r.en}</td><td>${fmt(r.t)}</td></tr>`).join("")}</table></div></div>`;
},
leads(){
  return`<div class="tb"><input placeholder="Tìm tên hoặc SĐT" value="${esc(Q)}" oninput="Q=this.value;$('bd').innerHTML=board()"><button class="b" onclick="addOpen()">+ Thêm hồ sơ</button></div><div id="bd">${board()}</div>`;
},
ctv(){
  return`<div class="pn"><h3>Thêm cộng tác viên</h3><div class="tb"><input id="cn" placeholder="Họ tên"><input id="cp" placeholder="Số điện thoại" inputmode="tel"><input id="ce" type="email" placeholder="Email (không bắt buộc)"><button class="b" onclick="addCtv()">Thêm CTV</button></div></div>
  <div class="pn"><div class="tw"><table><tr><th>Mã</th><th>Họ tên</th><th>SĐT</th><th>Hồ sơ</th><th>Nhập học</th><th>Hoa hồng</th><th>Còn phải chi</th><th></th></tr>
  ${S.ctv.map(c=>{const m=cm(c.id);return`<tr><td>${c.code}</td><td>${esc(c.name)}</td><td>${esc(c.phone)}</td><td>${m.n}</td><td>${m.en}</td><td>${fmt(m.t)}</td><td>${fmt(m.r)}</td><td>${m.r>0?`<button class="b s" onclick="pay(${c.id})">Đã chi</button>`:""}</td></tr>`}).join("")}</table></div></div>`;
},
set(){
  return`<div class="pn"><h3>Mức hoa hồng</h3><p class="mu">Hoa hồng "nộp hồ sơ" tính khi hồ sơ đạt từ bước Đã nộp hồ sơ trở đi. Hoa hồng "nhập học" tính thêm khi thí sinh nhập học.</p>
  <div class="tb"><label>Nộp hồ sơ (đ)<br><input id="fa" type="number" value="${S.fee.apply}"></label><label>Nhập học (đ)<br><input id="fe" type="number" value="${S.fee.enroll}"></label></div><button class="b" onclick="saveFee()">Lưu mức hoa hồng</button></div>
  <div class="pn"><h3>Dữ liệu demo</h3><div class="tb"><button class="b" onclick="seedDemo()">Nạp dữ liệu mẫu</button><button class="b g" onclick="wipe()">Xoá toàn bộ dữ liệu</button></div></div>`;
},
my(){
  const m=cm(me.id);
  return`<div class="kp">${kp("Hồ sơ của tôi",m.n)}${kp("Đã nộp hồ sơ",m.ap)}${kp("Đã nhập học",m.en)}${kp("Hoa hồng tạm tính",fmt(m.t))}${kp("Đã nhận",fmt(m.p))}${kp("Còn được nhận",fmt(m.r))}</div>
  <div class="pn"><h3>Cách tính</h3><p class="mu">Mỗi hồ sơ đã nộp: ${fmt(S.fee.apply)}. Mỗi thí sinh nhập học: thêm ${fmt(S.fee.enroll)}. Mã CTV của bạn: <b>${code(me.id)}</b>.</p></div>`;
}};

function card(l){
  const a=me.role=="admin";
  return`<div class="cd" ${a?`draggable="true" ondragstart="event.dataTransfer.setData('t',${l.id})"`:""}><b>${esc(l.name)}</b>
  <div class="mu">${esc(l.phone)} · ${esc(l.major)}</div><div class="mu">${code(l.ctv)}${l.note?" · "+esc(l.note):""}</div>
  ${a?`<select onchange="mv(${l.id},+this.value)" aria-label="Trạng thái">${ST.map((s,i)=>`<option value="${i}" ${i==l.st?"selected":""}>${s}</option>`).join("")}</select><button class="x" onclick="del(${l.id})">Xoá</button>`:`<span class="tg">${ST[l.st]}</span>`}</div>`;
}
function board(){
  const q=Q.toLowerCase(),L=vis().filter(l=>!q||l.name.toLowerCase().includes(q)||l.phone.includes(q));
  if(me.role!="admin")return L.length?`<div class="gl">${L.map(card).join("")}</div>`:`<p class="mu">Chưa có hồ sơ. Bấm "Thêm hồ sơ" để nhập thí sinh đầu tiên.</p>`;
  return`<div class="bd">${ST.map((s,i)=>{const c=L.filter(l=>l.st==i);return`<div class="col" ondragover="event.preventDefault()" ondrop="mv(+event.dataTransfer.getData('t'),${i})"><h4>${s}<span>${c.length}</span></h4>${c.map(card).join("")}</div>`}).join("")}</div>`;
}
function mv(id,i){const l=S.leads.find(x=>x.id==id);if(l){l.st=i;DB.setLead(l).catch(fail);R()}}
function del(id){if(dl!=id){dl=id;toast("Bấm Xoá lần nữa để xác nhận");return}DB.delLead(S.leads.find(l=>l.id==id).phone).catch(fail);dl=0;toast("Đã xoá hồ sơ")}
function cl(){$("md").className=""}
function addOpen(){
  $("md").innerHTML=`<div class="box"><h3>Thêm hồ sơ</h3><input id="fn" placeholder="Họ tên thí sinh *"><input id="fp" placeholder="Số điện thoại *" inputmode="tel">
  <select id="fm">${MJ.map(m=>`<option>${m}</option>`).join("")}</select>
  ${me.role=="admin"?`<select id="fc">${S.ctv.map(c=>`<option value="${c.id}">${esc(c.name)} (${c.code})</option>`).join("")}</select>`:""}
  <input id="fo" placeholder="Ghi chú"><div class="row"><button class="g" onclick="cl()">Huỷ</button><button onclick="addSave()">Lưu hồ sơ</button></div></div>`;
  $("md").className="on";$("fn").focus();
}
function addSave(){
  const name=$("fn").value.trim(),p=$("fp").value.replace(/\D/g,"").replace(/^84/,"0"),ctv=me.role=="admin"?+$("fc").value:me.id;
  if(!name||p.length<9)return toast("Nhập họ tên và số điện thoại hợp lệ (từ 9 chữ số)");
  const d=S.leads.find(l=>l.phone==p);
  if(d)return toast(`Số này đã do ${code(d.ctv)} nhập ngày ${new Date(d.ts).toLocaleDateString("vi-VN")}`);
  const c=S.ctv.find(x=>x.id==ctv);if(!c)return toast("Chưa chọn được CTV");
  DB.setLead({id:+p,name,phone:p,major:$("fm").value,ctv,ctvEmail:c.email||"",st:0,note:$("fo").value.trim(),ts:Date.now()})
   .then(()=>{cl();toast("Đã thêm hồ sơ")}).catch(e=>toast(e.code=="permission-denied"?"Số này đã có trong hệ thống hoặc bạn không có quyền":"Không lưu được: "+e.code));
}
function addCtv(){
  const n=$("cn").value.trim(),p=$("cp").value.trim(),e=$("ce").value.trim().toLowerCase();if(!n)return toast("Nhập họ tên CTV");
  const id=Math.max(0,...S.ctv.map(c=>c.id))+1;DB.setCtv({id,name:n,phone:p,email:e,code:"CTV"+String(id).padStart(3,"0"),paid:0}).then(()=>toast("Đã thêm CTV")).catch(fail)}
function pay(id){const c=S.ctv.find(x=>x.id==id);c.paid=cm(id).t;DB.setCtv(c).then(()=>toast("Đã ghi nhận chi hoa hồng")).catch(fail)}
function saveFee(){S.fee={apply:+$("fa").value||0,enroll:+$("fe").value||0};DB.setCfg({fee:S.fee}).then(()=>toast("Đã lưu mức hoa hồng")).catch(fail)}
function seedDemo(){
 const C=[[1,"Nguyễn Văn An","0901111111"],[2,"Trần Thị Bích","0902222222"],[3,"Lê Hoàng Cường","0903333333"]].map(([id,name,phone])=>({id,name,phone,email:"",code:"CTV00"+id,paid:0}));
 const N=["Phạm Minh Khôi","Nguyễn Thu Hà","Võ Quốc Bảo","Đặng Ngọc Anh","Lý Gia Huy","Hoàng Mai Linh","Bùi Tấn Phát","Trịnh Yến Nhi"],T=[1,1,2,2,3,3,1,2],X=[5,3,2,5,1,0,4,6];
 const L=N.map((name,i)=>{const phone="09110000"+String(i+1).padStart(2,"0");return{id:+phone,name,phone,major:MJ[i%MJ.length],ctv:T[i],ctvEmail:"",st:X[i],note:"",ts:Date.now()-i*864e5}});
 DB.seed(C,L,{apply:200000,enroll:1000000}).then(()=>toast("Đã nạp dữ liệu mẫu")).catch(fail)}
function wipe(){if(dl!=-1){dl=-1;toast("Bấm lần nữa để xoá toàn bộ dữ liệu");return}dl=0;DB.wipe().then(()=>toast("Đã xoá toàn bộ dữ liệu")).catch(fail)}
$("md").addEventListener("click",e=>{if(e.target.id=="md")cl()});
R();
</script>
<script type="module">
const U="https://www.gstatic.com/firebasejs/10.14.1/";
const cfg={apiKey:"AIzaSyD20NuXcT5fbU9gd7wolIslUVmHUW5_r5U",authDomain:"tuyesinh.firebaseapp.com",projectId:"tuyesinh",storageBucket:"tuyesinh.firebasestorage.app",messagingSenderId:"272736903727",appId:"1:272736903727:web:5960338ef6141caf81dcda"};
if(location.protocol=="file:")App.err("Firebase không chạy khi mở file trực tiếp (file://). Hãy chạy bằng localhost hoặc đưa lên Firebase Hosting.");
else try{
const {initializeApp}=await import(U+"firebase-app.js");
const {getAuth,signInAnonymously}=await import(U+"firebase-auth.js");
const {getFirestore,collection,doc,getDocs,setDoc,deleteDoc,onSnapshot}=await import(U+"firebase-firestore.js");
const auth=getAuth(initializeApp(cfg)),db=getFirestore();
window.DB={setLead:l=>setDoc(doc(db,"leads",l.phone),l),delLead:ph=>deleteDoc(doc(db,"leads",ph)),
 setCtv:c=>setDoc(doc(db,"ctv",String(c.id)),c),setCfg:o=>setDoc(doc(db,"settings","main"),o,{merge:true}),
 seed:(C,L,fee)=>Promise.all([...C.map(c=>DB.setCtv(c)),...L.map(l=>DB.setLead(l)),DB.setCfg({fee})]),
 wipe:async()=>{for(const n of["leads","ctv"])await Promise.all((await getDocs(collection(db,n))).docs.map(d=>deleteDoc(d.ref)))}};
await signInAnonymously(auth);
const er=e=>toast("Lỗi dữ liệu: "+e.code),all=s=>s.docs.map(d=>d.data());
onSnapshot(collection(db,"ctv"),s=>App.data("ctv",all(s)),er);
onSnapshot(collection(db,"leads"),s=>App.data("leads",all(s)),er);
onSnapshot(doc(db,"settings","main"),s=>App.data("cfg",s.data()||{}),er);
}catch(e){App.err(e.code=="auth/operation-not-allowed"?"Chưa bật đăng nhập ẩn danh (Anonymous) trong Firebase Authentication.":"Lỗi kết nối: "+(e.code||e.message))}
</script>
</body>
</html>
