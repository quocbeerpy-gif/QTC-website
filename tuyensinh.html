<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HRCGroup – CRM Tuyển sinh & CTV</title>
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js">
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js">
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#eef1ed;--cd:#fff;--tx:#16231f;--mu:#61706a;--pr:#0b6b5d;--pt:#fff;--ac:#e2a11f;--bd:#d8dfd9;--er:#b42318;--sf:#f6f8f5}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1614;--cd:#172320;--tx:#e6efe9;--mu:#93a59c;--pr:#3fbfa8;--pt:#08201b;--ac:#f0b544;--bd:#26352f;--er:#ff8a80;--sf:#1d2b27}}
:root[data-theme="dark"]{--bg:#0f1614;--cd:#172320;--tx:#e6efe9;--mu:#93a59c;--pr:#3fbfa8;--pt:#08201b;--ac:#f0b544;--bd:#26352f;--er:#ff8a80;--sf:#1d2b27}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 "Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--pr);color:var(--pt);display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:10px 16px}
header h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.2px;flex:1;min-width:150px}
header h1 small{display:block;font-weight:400;font-size:12px;opacity:.85}
header select{background:transparent;color:inherit;border:1px solid currentColor;border-radius:6px;padding:6px 8px;font:inherit;max-width:100%}
header select option{color:#16231f}
nav{display:flex;gap:4px;padding:8px 12px 0;overflow-x:auto;border-bottom:1px solid var(--bd);background:var(--cd)}
nav button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;font:inherit;color:var(--mu);cursor:pointer;white-space:nowrap}
nav button.on{color:var(--tx);border-color:var(--ac);font-weight:600}
main{padding:16px;max-width:1200px;margin:0 auto}
h3{margin:0 0 10px;font-size:16px}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.k{background:var(--cd);border:1px solid var(--bd);border-radius:8px;padding:12px 14px}
.k span{color:var(--mu);font-size:13px}.k b{display:block;font-size:22px;margin-top:2px}
.pn{background:var(--cd);border:1px solid var(--bd);border-radius:8px;padding:14px;margin-bottom:16px}
.br{display:grid;grid-template-columns:110px 1fr 30px;gap:10px;align-items:center;margin:6px 0;font-size:14px}
.br i{display:block;height:12px;background:var(--pr);border-radius:3px;min-width:2px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--bd);white-space:nowrap}
th{color:var(--mu);font-weight:500}
.tb{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
input,select.f{font:inherit;color:var(--tx);background:var(--cd);border:1px solid var(--bd);border-radius:6px;padding:9px 10px;min-width:0}
button.b,.box button{font:inherit;background:var(--pr);color:var(--pt);border:0;border-radius:6px;padding:9px 14px;cursor:pointer;font-weight:600}
button.g{background:transparent!important;color:var(--tx)!important;border:1px solid var(--bd)!important}
button.s{padding:4px 9px;font-size:13px}
.bd{display:flex;gap:10px;overflow-x:auto;align-items:flex-start;padding-bottom:8px}
.col{flex:0 0 230px;background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:8px;min-height:120px}
.col h4{margin:2px 4px 8px;font-size:13px;display:flex;justify-content:space-between}
.col h4 span{color:var(--mu)}
.cd{background:var(--cd);border:1px solid var(--bd);border-left:3px solid var(--ac);border-radius:6px;padding:9px 10px;margin-bottom:8px;font-size:14px}
.cd select{width:100%;margin-top:6px;font:inherit;font-size:13px;background:var(--cd);color:var(--tx);border:1px solid var(--bd);border-radius:5px;padding:4px}
.mu{color:var(--mu);font-size:13px}
.tg{display:inline-block;padding:1px 8px;border-radius:10px;background:var(--sf);border:1px solid var(--bd);font-size:12px;margin-top:4px}
.x{background:none;border:0;color:var(--er);cursor:pointer;font:inherit;font-size:12px;padding:6px 0 0}
.gl{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
#md{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9;align-items:center;justify-content:center;padding:16px}
#md.on{display:flex}
.box{background:var(--cd);border-radius:10px;padding:18px;width:100%;max-width:400px;display:grid;gap:10px}
.box h3{margin:0}.box input,.box select{width:100%;font:inherit;color:var(--tx);background:var(--cd);border:1px solid var(--bd);border-radius:6px;padding:9px 10px}
.row{display:flex;gap:8px;justify-content:flex-end}
#ts{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:10;max-width:90%}
#ts.on{opacity:1}
footer{color:var(--mu);font-size:12px;text-align:center;padding:8px 16px 24px}
.hb{background:none;border:1px solid currentColor;color:inherit;border-radius:6px;padding:4px 10px;cursor:pointer;font:inherit;font-size:13px}
main{max-width:1400px}
.tb input{flex:1;min-width:140px}
.kp{grid-template-columns:repeat(auto-fit,minmax(165px,1fr))}
.k{position:relative;overflow:hidden;padding:14px 14px 12px 18px}
.k:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c,var(--pr))}
.k small{display:block;color:var(--mu);font-size:12px;margin-top:2px}
.hd{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:4px;margin-bottom:12px}.hd h2{margin:0;font-size:20px}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:12px;margin-bottom:12px}.g2 .pn{margin:0}
.br{grid-template-columns:120px 1fr auto}.br span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.br b{text-align:right}
.dn{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.ring{width:140px;height:140px;border-radius:50%;flex:none;display:grid;place-items:center}
.ring b{background:var(--cd);width:90px;height:90px;border-radius:50%;display:grid;place-items:center;font-size:24px}
.lg div{display:flex;align-items:center;gap:8px;font-size:13px;margin:3px 0}.lg i{width:10px;height:10px;border-radius:3px;flex:none}
.tr{display:flex;align-items:flex-end;gap:4px;height:120px}
.tr div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;font-size:10px;color:var(--mu);min-width:0}
.tr i{width:100%;background:var(--pr);border-radius:3px 3px 0 0;min-height:2px;margin:2px 0}
.rk{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--sf);border:1px solid var(--bd);font-size:12px;font-weight:600}
.pg{height:6px;background:var(--sf);border-radius:3px;min-width:50px}.pg i{display:block;height:100%;background:var(--pr);border-radius:3px}
.rc{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd);font-size:14px}.rc:last-child{border:0}
.bd{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;overflow:visible}
.col{flex:none;min-width:0;max-height:calc(100vh - 220px);overflow-y:auto;padding:6px;border-top:3px solid var(--c)}
.col h4{font-size:12px;position:sticky;top:0;background:var(--sf);margin:0 0 6px;padding:2px}
.cd{padding:6px 8px;margin-bottom:6px;font-size:12.5px;line-height:1.35;border-left-color:var(--c,var(--ac))}
.cd .t{display:flex;justify-content:space-between;gap:6px;align-items:center}.cd .t b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cd .mu{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cd select{margin-top:4px;padding:2px;font-size:12px}.cd .t select{flex:1;width:auto}.cd .x{padding:0 2px}
.ch{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:8px}
.ch button{flex:none;border:1px solid var(--bd);background:var(--cd);color:var(--tx);border-radius:16px;padding:5px 12px;font:inherit;font-size:13px;cursor:pointer}
.ch button.on{background:var(--pr);color:var(--pt);border-color:var(--pr)}
@media(max-width:700px){
header{padding:8px 12px}header select{flex:1}
main{padding:12px 12px 84px}
nav{position:fixed;bottom:0;left:0;right:0;z-index:6;justify-content:space-around;gap:0;padding:0 0 env(safe-area-inset-bottom,0px);border-top:1px solid var(--bd);border-bottom:0}
nav button{flex:1;padding:10px 2px;font-size:12px;border-bottom:0;border-top:3px solid transparent}
nav button.on{border-top-color:var(--ac)}
.kp{grid-template-columns:1fr 1fr;gap:8px}.k b{font-size:19px}
.br{grid-template-columns:88px 1fr auto}
.ring{width:120px;height:120px}.ring b{width:76px;height:76px;font-size:20px}
input,select,.box input,.box select{font-size:16px}
#ts{bottom:calc(76px + env(safe-area-inset-bottom,0px))}
footer{display:none}}
td a{color:var(--pr);text-decoration:none}.tb button:disabled{opacity:.4}
</style>
</head>
<body>
<header>
  <h1>HRCGroup<small>CRM Tuyển sinh & Cộng tác viên</small></h1>
  <div id="who" style="display:flex;gap:8px;align-items:center;font-size:13px"></div>
</header>
<nav id="nav"></nav>
<main id="main"></main>
<footer>Dữ liệu được đồng bộ trực tiếp qua Firebase (Firestore) và phân quyền theo tài khoản đăng nhập.</footer>
<div id="md"></div><div id="ts"></div>
<script>
const ST=["Mới","Đã liên hệ","Quan tâm","Đã nộp hồ sơ","Trúng tuyển","Nhập học","Từ chối"];
let MJ=["Cao đẳng Dược"];
const SC=["#8a97a3","#3b82f6","#a855f7","#f59e0b","#14b8a6","#16a34a","#ef4444"];
const mob=matchMedia("(max-width:999px)");mob.addEventListener("change",()=>R());
let F=-1;
const ago=t=>{const d=Math.floor((Date.now()-t)/864e5);return d<1?"Hôm nay":d+" ngày trước"};
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=n=>Number(n||0).toLocaleString("vi-VN")+"đ";
let LOAD=true,got={},S={ctv:[],leads:[],students:[],fee:{apply:200000,enroll:1000000}},me=null,tab="dash",Q="",dl=0;

const fail=e=>toast("Không lưu được: "+(e.code||e.message));
function toast(m){const t=$("ts");t.textContent=m;t.className="on";clearTimeout(toast.t);toast.t=setTimeout(()=>t.className="",2600)}
const code=id=>(S.ctv.find(c=>c.id==id)||{code:"—"}).code;
const vis=()=>me.role=="admin"?S.leads:S.leads.filter(l=>l.ctv==me.id);
function cm(id){const L=S.leads.filter(l=>l.ctv==id),ap=L.filter(l=>l.st>=3&&l.st<=5).length,en=L.filter(l=>l.st==5).length,t=ap*S.fee.apply+en*S.fee.enroll,p=(S.ctv.find(c=>c.id==id)||{}).paid||0;return{n:L.length,ap,en,t,p,r:t-p}}

window.App={
 user(m,msg){me=m;S={ctv:[],leads:[],students:[],fee:S.fee};LOAD=!!m;got={};if(m)tab=m.role=="admin"?"dash":"leads";R(msg)},
 data(k,v){got[k]=1;if(got.ctv&&got.leads)LOAD=false;if(k=="cfg"){S.fee=v.fee||S.fee;if(v.majors&&v.majors.length)MJ=v.majors}else S[k]=v;const a=document.activeElement;if(!(a&&a.tagName=="INPUT"&&$("main").contains(a)))R()}
};
function loginView(msg){return`<div class="pn" style="max-width:380px;margin:24px auto"><h3>Đăng nhập HRCGroup</h3><div class="box" style="padding:0;max-width:none"><input id="em" placeholder="Tên đăng nhập hoặc email" autocapitalize="none" autocomplete="username"><input id="pw" type="password" placeholder="Mật khẩu (từ 6 ký tự)"><div class="row"><button class="g" onclick="auth(1)">Tạo tài khoản</button><button onclick="auth(0)">Đăng nhập</button></div></div>${msg?`<p class="mu" style="color:var(--er)">${esc(msg)}</p>`:""}<p class="mu">Admin: nhập "Admin" và mật khẩu. CTV: dùng đúng email ban tuyển sinh đã đăng ký cho bạn, bấm "Tạo tài khoản" ở lần đầu.</p></div>`}
function auth(n){let e=$("em").value.trim().toLowerCase();const p=$("pw").value;if(e&&!e.includes("@"))e+="@hrcgroup.app";if(!e||p.length<6)return toast("Nhập tên đăng nhập và mật khẩu từ 6 ký tự");if(n&&e==ADMIN_EMAIL)return toast("Tài khoản Admin do quản trị tạo sẵn trong Firebase Console");
 DB.auth(n,e,p).catch(x=>toast(({"auth/invalid-credential":"Sai email hoặc mật khẩu","auth/email-already-in-use":"Email đã có tài khoản, hãy đăng nhập","auth/weak-password":"Mật khẩu quá yếu"})[x.code]||"Lỗi: "+x.code))}
function R(msg){
  if(!me){$("who").innerHTML="";$("nav").innerHTML="";$("main").innerHTML=loginView(msg);return}
  $("who").innerHTML=`<span>${esc(me.role=="admin"?"Admin":me.email)}</span><button class="hb" onclick="DB.logout()">Đăng xuất</button>`;
  const T=me.role=="admin"?[["dash","Tổng quan"],["leads","Hồ sơ"],["ctv","CTV"],["sv","Sinh viên"],["cs","Gọi lại"],["set","Cài đặt"]]:[["leads","Hồ sơ của tôi"],["my","Hoa hồng"]];
  $("nav").innerHTML=T.map(([k,n])=>`<button class="${k==tab?"on":""}" onclick="tab='${k}';R()">${n}</button>`).join("");
  $("main").innerHTML=LOAD?`<div class="pn mu">Đang tải dữ liệu từ Firebase…</div>`:V[tab]();
}
const kp=(a,b)=>`<div class="k"><span>${a}</span><b>${b}</b></div>`;

const V={
dash(){return this.dash0()+sdash()},
dash0(){
  const L=S.leads,n=L.length,D=864e5,now=Date.now(),cnt=ST.map((_,i)=>L.filter(l=>l.st==i).length),pc=(a,b)=>b?Math.round(a/b*100)+"%":"0%";
  const ap=L.filter(l=>l.st>=3&&l.st<=5).length,en=cnt[5],w=L.filter(l=>now-l.ts<7*D).length,mx=Math.max(1,...cnt);
  const rk=S.ctv.map(c=>({c,...cm(c.id)})).sort((a,b)=>b.en-a.en||b.n-a.n),tot=rk.reduce((a,r)=>a+r.t,0),due=rk.reduce((a,r)=>a+r.r,0);
  const k2=(a,b,c,col)=>`<div class="k" style="--c:${col}"><span>${a}</span><b>${b}</b><small>${c}</small></div>`;
  let acc=0;const cg=n?ST.map((_,i)=>{const a=acc/n*100;acc+=cnt[i];return`${SC[i]} ${a}% ${acc/n*100}%`}).join(","):"var(--bd) 0 100%";
  const tr=[...Array(14)].map((_,i)=>{const d=new Date(now-(13-i)*D),k=d.toDateString();return{d:d.getDate(),v:L.filter(l=>new Date(l.ts).toDateString()==k).length}}),tm=Math.max(1,...tr.map(x=>x.v));
  const mj=allMJ().map(m=>({m,n:L.filter(l=>l.major==m).length,e:L.filter(l=>l.major==m&&l.st==5).length})).sort((a,b)=>b.n-a.n),mm=Math.max(1,mj[0].n);
  const rc=[...L].sort((a,b)=>b.ts-a.ts).slice(0,6);
  return`<div class="hd"><h2>Tổng quan tuyển sinh</h2><span class="mu">${new Date().toLocaleDateString("vi-VN",{weekday:"long",day:"numeric",month:"numeric",year:"numeric"})}</span></div>
  ${n?"":`<div class="pn mu">Chưa có hồ sơ nào. Thêm hồ sơ đầu tiên ở tab Hồ sơ.</div>`}
  <div class="kp">${k2("Tổng hồ sơ",n,`+${w} trong 7 ngày qua`,"#3b82f6")}${k2("Đang chăm sóc",cnt[1]+cnt[2],`${cnt[0]} hồ sơ mới chưa liên hệ`,"#a855f7")}${k2("Đã nộp hồ sơ",ap,`${pc(ap,n)} trên tổng số`,"#f59e0b")}${k2("Đã nhập học",en,`${cnt[4]} trúng tuyển, chờ nhập học`,"#16a34a")}${k2("Tỷ lệ chuyển đổi",pc(en,n),`${cnt[6]} hồ sơ từ chối`,"#14b8a6")}${k2("Hoa hồng phát sinh",fmt(tot),`Còn phải chi ${fmt(due)}`,"#e2a11f")}</div>
  <div class="g2"><div class="pn"><h3>Phễu tuyển sinh</h3>${ST.map((s,i)=>`<div class="br"><span>${s}</span><i style="width:${cnt[i]/mx*100}%;background:${SC[i]}"></i><b>${cnt[i]}</b></div>`).join("")}</div>
  <div class="pn"><h3>Cơ cấu trạng thái</h3><div class="dn"><div class="ring" style="background:conic-gradient(${cg})"><b>${n}</b></div><div class="lg">${ST.map((s,i)=>`<div><i style="background:${SC[i]}"></i>${s}: <b>${cnt[i]}</b> (${pc(cnt[i],n)})</div>`).join("")}</div></div></div></div>
  <div class="g2"><div class="pn"><h3>Hồ sơ mới 14 ngày gần nhất</h3><div class="tr">${tr.map(x=>`<div title="${x.v} hồ sơ">${x.v||""}<i style="height:${x.v/tm*80}px"></i>${x.d}</div>`).join("")}</div></div>
  <div class="pn"><h3>Theo ngành (nhập học / tổng)</h3>${mj.map(m=>`<div class="br"><span title="${m.m}">${m.m}</span><i style="width:${m.n/mm*100}%"></i><b>${m.e}/${m.n}</b></div>`).join("")}</div></div>
  <div class="g2"><div class="pn"><h3>Xếp hạng cộng tác viên (${S.ctv.length})</h3><div class="tw"><table><tr><th>#</th><th>CTV</th><th>Hồ sơ</th><th>Đã nộp</th><th>Nhập học</th><th>Chuyển đổi</th><th>Hoa hồng</th><th>Còn chi</th></tr>
  ${rk.map((r,i)=>`<tr><td><span class="rk">${i+1}</span></td><td>${esc(r.c.name)}<div class="mu">${r.c.code}</div></td><td>${r.n}</td><td>${r.ap}</td><td>${r.en}</td><td><div style="display:flex;gap:6px;align-items:center"><div class="pg" style="flex:1"><i style="width:${r.n?r.en/r.n*100:0}%"></i></div>${pc(r.en,r.n)}</div></td><td>${fmt(r.t)}</td><td>${fmt(r.r)}</td></tr>`).join("")}</table></div></div>
  <div class="pn"><h3>Hồ sơ mới nhất</h3>${rc.map(l=>`<div class="rc"><div><b>${esc(l.name)}</b><div class="mu">${esc(l.major)} · ${code(l.ctv)}</div></div><div style="text-align:right"><span class="tg" style="border-color:${SC[l.st]}">${ST[l.st]}</span><div class="mu">${ago(l.ts)}</div></div></div>`).join("")||'<p class="mu">Chưa có hồ sơ.</p>'}</div></div>`;
},
leads(){
  return`<div class="tb"><input placeholder="Tìm tên hoặc SĐT" value="${esc(Q)}" oninput="Q=this.value;$('bd').innerHTML=board()"><button class="b" onclick="addOpen()">+ Thêm hồ sơ</button></div><div id="bd">${board()}</div>`;
},
ctv(){
  return`<div class="pn"><h3>Thêm cộng tác viên</h3><div class="tb"><input id="cn" placeholder="Họ tên"><input id="cp" placeholder="Số điện thoại" inputmode="tel"><input id="ce" type="email" placeholder="Email đăng nhập của CTV"><button class="b" onclick="addCtv()">Thêm CTV</button></div></div>
  <div class="pn"><div class="tw"><table><tr><th>Mã</th><th>Họ tên</th><th>SĐT</th><th>Hồ sơ</th><th>Nhập học</th><th>Hoa hồng</th><th>Còn phải chi</th><th></th></tr>

}catch(e){App.user(null,"Lỗi tải Firebase: "+(e.code||e.message))}
</script>
