box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
*,*:before,*:after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Segoe UI",Roboto,Arial,sans-serif;min-height:100vh}
.scroller{overflow-x:auto;display:flex;justify-content:center}
.stage{position:relative;flex:none;width:min(100vw,150vh);min-width:760px;aspect-ratio:3/2;container-type:inline-size;
background:#050a24 var(--img) center/100% 100% no-repeat}
.a{position:absolute}
button{font-family:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
/* class buttons */
.cb{background:transparent;border:0;border-radius:1.3cqw;cursor:pointer;transition:box-shadow .15s}
.cb:hover{box-shadow:0 0 1.4cqw var(--cy)}
.cb.on{box-shadow:0 0 0 .25cqw var(--gold),0 0 1.8cqw var(--gold);background:#ffc83d1c}
.cb.on:after{content:"✓";position:absolute;right:.5cqw;top:.4cqw;background:var(--gold);color:#123;font-weight:800;font-size:1.1cqw;width:1.8cqw;height:1.8cqw;border-radius:50%;display:grid;place-items:center}
/* name */
#name{width:100%;height:100%;border-radius:1.1cqw;border:.12cqw solid #d6e6ff;background:#071a52;color:#fff;font-size:1.15cqw;padding:0 1cqw 0 3cqw}
#name::placeholder{color:#b8c9ee}
.ni{position:absolute;left:1cqw;top:50%;transform:translateY(-50%);font-size:1.5cqw}
#err{color:#ff8da1;font-size:.95cqw;text-align:center;line-height:1;display:flex;align-items:center;justify-content:center;font-weight:600;text-shadow:0 0 .6cqw #000}
#go{background:transparent;border:0;border-radius:.9cqw;cursor:pointer;transition:box-shadow .15s}
#go:hover{box-shadow:0 0 1.6cqw var(--cy),inset 0 0 1.2cqw #38d6ff55}
/* leaderboard */
#lbp{background:linear-gradient(#0a1c58,#08164a);border-radius:.6cqw}
.lh,.lr{display:grid;grid-template-columns:12% 46% 14% 28%;align-items:center;font-size:.95cqw;padding:0 .8cqw}
.lh{position:absolute;left:0;right:0;top:0;height:9.09%;color:#cfe0ff;font-weight:600;border-bottom:1px solid #2f7bff66}
#lbl{position:absolute;left:0;right:0;top:9.09%;bottom:0;overflow-y:auto;scrollbar-width:thin;scrollbar-color:#2f7bff #08164a}
.lr{height:10%;border-bottom:1px solid #2f7bff22}
.lr span:nth-child(n+3),.lh span:nth-child(n+3){text-align:center}
.lr span:last-child,.lh span:last-child{text-align:right}
.lr .n{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-weight:600}
.lr.t1{background:#ffc83d26;box-shadow:inset 0 0 0 .1cqw #ffc83d99;color:#fff;font-weight:700}
.lr.t2{background:#9fb7e022;color:#fff}.lr.t3{background:#ff8a3d22;color:#fff}
.lr.me{color:var(--cy)}
#more{background:#08164a;border:1px solid #2f7bffaa;border-radius:2cqw;color:#fff;font-size:.95cqw;cursor:pointer}
#more:hover{box-shadow:0 0 1cqw var(--cy)}
.fb{background:transparent;border:0;border-radius:1.3cqw;cursor:pointer;transition:box-shadow .15s,background .15s}
.fb:hover{box-shadow:0 0 1.4cqw var(--cy),inset 0 0 1.4cqw #38d6ff44;background:#38d6ff14}
.m,.mh,.ms,.lt{display:none}
.cw,.tw{display:contents}
#st{display:flex;align-items:center;font-size:.85cqw;color:#8fa8d8;white-space:nowrap}
/* game overlay */
#ov{position:fixed;inset:0;z-index:10;background:#030618dd;backdrop-filter:blur(6px);overflow:auto;display:none;padding:calc(16px + env(safe-area-inset-top,0px)) 14px calc(16px + env(safe-area-inset-bottom,0px))}
#ov.on{display:block}
.pn{max-width:760px;margin:0 auto;background:linear-gradient(160deg,#0b1f5c,#071238);border:1.5px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 0 30px #2f7bff55}
.pn h2{margin:0;text-align:center;font-size:30px;font-style:italic;background:linear-gradient(#fff,#7fd0ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{text-align:center;color:var(--mut);margin:6px 0 0}
.topics{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-top:16px}
.topics button{cursor:pointer;border:1.5px solid var(--line);background:#071a58;color:var(--tx);border-radius:14px;padding:14px 8px;font-size:14px;font-weight:700}
.topics button:hover{box-shadow:0 0 16px var(--cy)}
.topics i{display:block;font-style:normal;font-size:30px;margin-bottom:4px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:700;flex-wrap:wrap}
.prog{height:10px;border-radius:6px;background:#0b1a4a;margin:10px 0;overflow:hidden;border:1px solid var(--line)}
.prog div{height:100%;background:linear-gradient(90deg,var(--cy),var(--vio));transition:width .2s}
.q{font-size:clamp(22px,4.5vw,32px);text-align:center;margin:18px 6px;font-weight:700;min-height:90px;display:flex;align-items:center;justify-content:center}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opts button{padding:16px;border-radius:14px;border:2px solid var(--line);background:#0b2a80;color:var(--tx);font-size:24px;font-weight:800;cursor:pointer}
.opts button.ok{background:var(--ok);color:#022;border-color:#fff}.opts button.no{background:var(--bad);border-color:#fff}
.fb2{text-align:center;color:var(--cy);min-height:24px;margin:12px 0 0;font-weight:600}
.big{font-size:60px;text-align:center;font-weight:800;color:var(--gold);margin:6px 0}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.btn{padding:11px 28px;border-radius:12px;border:2px solid var(--cy);background:linear-gradient(#1f6bff,#0c3fc4);color:#fff;font-weight:800;font-size:17px;cursor:pointer}
.btn.g{background:transparent}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="scroller">
<div class="stage" id="stage">
 <div class="mh"><div class="br"><span>🧠</span><div style="text-align:left;line-height:1">QTC AI<small>THÔNG MINH HƠN - TƯƠNG LAI TỐT HƠN</small></div></div><h1>QTC AI<br>MATH GAME</h1><span class="bd">TOÁN LỚP 3 &amp; LỚP 4</span><p>Rèn luyện tư duy - Nâng tầm trí tuệ</p></div>
 <div class="cw">
  <button class="a cb" data-g="3" type="button" aria-label="Chọn Lớp 3" style="left:48.2%;top:40%;width:12.9%;height:15.2%"><span class="m"><i>👦</i><b>LỚP 3</b><small>Cơ bản - Tự tin</small></span></button>
  <button class="a cb" data-g="4" type="button" aria-label="Chọn Lớp 4" style="left:62.3%;top:40%;width:12.7%;height:15.2%"><span class="m"><i>👧</i><b>LỚP 4</b><small>Thử thách - Vượt trội</small></span></button>
 </div>
 <div class="a" id="nw" style="left:48.5%;top:61.4%;width:25.5%;height:4.5%"><span class="ni">👤</span><input id="name" type="text" maxlength="24" placeholder="Nhập tên của bạn..." autocomplete="off" aria-label="Tên người chơi"></div>
 <div class="a" id="err" role="alert" style="left:48.5%;top:66%;width:25.5%;height:1.8%"></div>
 <button class="a" id="go" type="button" aria-label="Bắt đầu" style="left:53.7%;top:67.9%;width:15.3%;height:5.7%"><span class="m">▶ BẮT ĐẦU</span></button>
 <div class="a" id="lbp" style="left:78.6%;top:24.6%;width:19.4%;height:43.4%">
  <div class="lt">🏆 Bảng xếp hạng</div>
  <div class="lh"><span>#</span><span>Tên người chơi</span><span>Lớp</span><span>Điểm</span></div>
  <div id="lbl"></div>
 </div>
 <button class="a" id="more" type="button" style="left:84.8%;top:69.1%;width:7%;height:2.9%">Xem thêm ›</button>
 <div class="a" id="st" style="left:78.8%;top:69.1%;width:5.7%;height:2.9%"></div>
 <div class="tw">
  <button class="a fb" data-t="calc" type="button" aria-label="Cộng trừ nhân chia" style="left:46.6%;top:77.9%;width:8.8%;height:10.8%"><span class="m"><i>➕</i>Cộng - Trừ - Nhân - Chia</span></button>
  <button class="a fb" data-t="unknown" type="button" aria-label="So sánh, tìm số chưa biết" style="left:56.8%;top:77.9%;width:8.9%;height:10.8%"><span class="m"><i>🧠</i>So sánh - Tìm số chưa biết</span></button>
  <button class="a fb" data-t="units" type="button" aria-label="Đo lường đơn vị" style="left:66.9%;top:77.9%;width:8.9%;height:10.8%"><span class="m"><i>📏</i>Đo lường - Đơn vị</span></button>
  <button class="a fb" data-t="word" type="button" aria-label="Toán có lời văn" style="left:77.5%;top:77.9%;width:8.9%;height:10.8%"><span class="m"><i>📝</i>Toán có lời văn - Tư duy logic</span></button>
  <button class="a fb" data-t="mix" type="button" aria-label="Rèn luyện kỹ năng" style="left:88%;top:77.9%;width:8.9%;height:10.8%"><span class="m"><i>🎯</i>Rèn luyện kỹ năng</span></button>
 </div>
 <div class="ms">“HỌC TOÁN KHÔNG KHÓ KHI CÓ QTC AI”</div>
</div>
</div>

<div id="ov">
 <div class="pn" id="s-menu" hidden>
  <h2 id="hello"></h2><p class="sub">Chọn chủ đề (10 câu, mỗi câu 20 giây)</p>
  <div class="topics" id="topics"></div>
  <div class="row"><button class="btn g" id="close1" type="button">Quay lại</button></div>
 </div>
 <div class="pn" id="s-play" hidden>
  <div class="bar"><span id="pi"></span><span id="pt"></span><span id="ps"></span><button class="btn g" id="quit" type="button" style="padding:4px 14px;font-size:14px">Thoát</button></div>
  <div class="prog"><div id="pb"></div></div>
  <div class="q" id="pq"></div><div class="opts" id="po"></div><p class="fb2" id="pf"></p>
 </div>
 <div class="pn" id="s-res" hidden>
  <h2>KẾT QUẢ</h2><div class="big" id="rs"></div><p class="sub" id="rt"></p>
  <div class="row"><button class="btn" id="again" type="button">Chơi lại</button><button class="btn g" id="home" type="button">Về trang chủ</button></div>
 </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* ===== FIREBASE: dán cấu hình web app của anh vào đây (Firebase Console > Project settings > Your apps) ===== */
const FIREBASE_CONFIG={
  apiKey:"AIzaSyB46oemQgQyxLeFLGRkYWfiWLNzNiBhzmA",
  authDomain:"game-qtc.firebaseapp.com",
  projectId:"game-qtc",
  storageBucket:"game-qtc.firebasestorage.app",
  messagingSenderId:"370862820282",
  appId:"1:370862820282:web:ab469129b1f028cc976b83",
  measurementId:"G-6N9KB98J7P"
};
const $=id=>document.getElementById(id);
const R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[R(0,a.length-1)];
const NAMES=["Lan","Nam","Minh","Hoa","Bình","An"];
const SEED=[["Nguyễn Minh Anh",4,3850],["Trần Gia Huy",4,3420],["Lê Phương Thảo",3,3210],["Hoàng Đức Minh",4,2980],["Phạm Bảo Ngọc",3,2760],["Đỗ Minh Quân",4,2540],["Nguyễn Thảo Vy",3,2310],["Lê Quang Anh",4,2180],["Vũ Hoàng Long",3,1980],["Phan Nhật Minh",4,1760]];
let grade=0,player="",qs=[],idx=0,score=0,right=0,streak=0,tmr=null,left=20,showAll=false,locked=false,lastKey="",topic="",db=null,online=false,cache=null;

function loadLB(){return online&&cache?cache.slice():localLoad()}
function localLoad(){try{const s=localStorage.getItem("qtc-lb");if(s)return JSON.parse(s)}catch(e){}return SEED.map(x=>({n:x[0],g:x[1],s:x[2]}))}
function saveLB(l){try{localStorage.setItem("qtc-lb",JSON.stringify(l))}catch(e){}}
function renderLB(){
 const l=loadLB().sort((a,b)=>b.s-a.s).slice(0,20),n=showAll?20:10,box=$("lbl");
 box.innerHTML="";
 if(!l.length)box.innerHTML='<div class="lr" style="display:block;height:auto;padding:12px;color:#8fa8d8">Chưa có ai trên bảng. Hãy là người đầu tiên!</div>';
 l.slice(0,n).forEach((p,i)=>{
  const r=document.createElement("div");r.className="lr"+(i<3?" t"+(i+1):"")+(p.n+p.g+p.s===lastKey?" me":"");
  const c=[i<3?["🥇","🥈","🥉"][i]:String(i+1),p.n,String(p.g),p.s.toLocaleString("en-US")];
  c.forEach((t,j)=>{const s=document.createElement("span");if(j===1)s.className="n";s.textContent=t;r.appendChild(s)});
  box.appendChild(r);
 });
 $("more").textContent=showAll?"Thu gọn ˄":"Xem thêm ›";
}
/* ---- question generators ---- */
function wrongs(c,step){const s=new Set([c]);let t=0;while(s.size<4&&t++<60){let d=pick([-3,-2,-1,1,2,3,10,-10])*step;let v=c+d;if(v>=0)s.add(v)}let i=1;while(s.size<4)s.add(c+i++);return [...s].sort(()=>Math.random()-.5)}
function mk(q,a,step){return{q,a,o:wrongs(a,step||1)}}
const G={
 calc(g){
  const t=R(1,4);
  if(g==3){
   if(t==1){const a=R(100,600),b=R(50,350);return mk(`${a} + ${b} = ?`,a+b,10)}
   if(t==2){const a=R(300,900),b=R(40,290);return mk(`${a} − ${b} = ?`,a-b,10)}
   if(t==3){const a=R(2,9),b=R(2,9);return mk(`${a} × ${b} = ?`,a*b,a)}
   const b=R(2,9),c=R(2,9);return mk(`${b*c} : ${b} = ?`,c,1)
  }
  if(t==1){const a=R(1200,9500),b=R(1200,9000);return mk(`${a} + ${b} = ?`,a+b,100)}
  if(t==2){const a=R(5000,9900),b=R(1200,4900);return mk(`${a} − ${b} = ?`,a-b,100)}
  if(t==3){const a=R(12,99),b=R(3,9);return mk(`${a} × ${b} = ?`,a*b,b*2)}
  const b=R(3,9),c=R(12,99);return mk(`${b*c} : ${b} = ?`,c,2)
 },
 unknown(g){
  const t=R(1,3);
  if(g==3){
   if(t==1){const a=R(10,300),x=R(10,400);return mk(`x + ${a} = ${x+a}. Tìm x`,x,5)}
   if(t==2){const a=R(2,9),x=R(2,9);return mk(`x × ${a} = ${x*a}. Tìm x`,x,1)}
   const a=R(100,500),b=R(100,500);const q=a>b?[a,b]:[b,a];return mk(`Số lớn hơn: ${a} hay ${b}? Hiệu của hai số là bao nhiêu?`,Math.abs(a-b),10)
  }
  if(t==1){const a=R(100,900),x=R(100,900);return mk(`x − ${a} = ${x}. Tìm x`,x+a,10)}
  if(t==2){const a=R(3,9),x=R(12,90);return mk(`x : ${a} = ${x}. Tìm x`,x*a,a)}
  const a=R(2,9),x=R(11,60);return mk(`${a} × x = ${a*x}. Tìm x`,x,2)
 },
 units(g){
  const t=R(1,4);
  if(g==3){
   if(t==1){const m=R(2,9);return mk(`${m} m = ... cm`,m*100,50)}
   if(t==2){const k=R(2,9);return mk(`${k} kg = ... g`,k*1000,500)}
   if(t==3){const k=R(2,9);return mk(`${k} km = ... m`,k*1000,500)}
   const c=R(2,9);return mk(`${c} cm = ... mm`,c*10,10)
  }
  if(t==1){const k=R(2,9);return mk(`${k} tấn = ... kg`,k*1000,500)}
  if(t==2){const p=R(2,9);return mk(`${p} phút = ... giây`,p*60,30)}
  if(t==3){const h=R(2,9);return mk(`${h} giờ = ... phút`,h*60,30)}
  const d=R(2,9);return mk(`${d} dm² = ... cm²`,d*100,50)
 },
 word(g){
  const n=pick(NAMES),t=R(1,3);
  if(g==3){
   if(t==1){const a=R(20,90),b=R(10,60);return mk(`${n} có ${a} viên bi, được cho thêm ${b} viên. ${n} có tất cả bao nhiêu viên bi?`,a+b,5)}
   if(t==2){const a=R(3,9),b=R(3,9);return mk(`Mỗi hộp có ${a} cái bánh. ${b} hộp như vậy có bao nhiêu cái bánh?`,a*b,a)}
   const b=R(3,9),c=R(3,9);return mk(`Có ${b*c} quyển vở chia đều cho ${b} bạn. Mỗi bạn được mấy quyển?`,c,1)
  }
  if(t==1){const a=R(12,40),b=R(3,9);return mk(`Mỗi ngày ${n} đọc ${a} trang sách. Hỏi sau ${b} ngày ${n} đọc được bao nhiêu trang?`,a*b,b*2)}
  if(t==2){const a=R(40,90),b=R(40,90),c=R(40,90),s=a+b+c,m=Math.round(s/3);const A=a,B=b,C=c+((3-s%3)%3);const m2=(A+B+C)/3;return mk(`Ba bạn cân nặng ${A} kg, ${B} kg và ${C} kg. Trung bình mỗi bạn nặng bao nhiêu kg?`,m2,1)}
  const a=R(2,9),p=R(5,20)*1000,tt=a*p;return mk(`${a} quyển truyện giá ${tt.toLocaleString("vi-VN")} đồng. Hỏi 1 quyển giá bao nhiêu đồng?`,p,1000)
 }
};
const TOPICS=[["calc","➕","Cộng - Trừ - Nhân - Chia"],["unknown","🧠","So sánh - Tìm số chưa biết"],["units","📏","Đo lường - Đơn vị"],["word","📝","Toán có lời văn - Tư duy logic"],["mix","🎯","Rèn luyện kỹ năng"]];



function showS(id){["menu","play","res"].forEach(x=>$("s-"+x).hidden=x!==id);$("ov").classList.add("on");$("ov").scrollTop=0}
function closeOv(){clearInterval(tmr);$("ov").classList.remove("on");renderLB()}
function setErr(t){$("err").textContent=t}
document.querySelectorAll(".cb").forEach(b=>b.onclick=()=>{grade=+b.dataset.g;document.querySelectorAll(".cb").forEach(x=>x.classList.toggle("on",x===b));setErr("")});
$("more").onclick=()=>{showAll=!showAll;renderLB()};
function tryStart(topic){
 const n=$("name").value.trim();
 if(!grade){setErr("Hãy chọn Lớp 3 hoặc Lớp 4");return}
 if(!n){setErr("Hãy nhập tên của bạn");$("name").focus();return}
 setErr("");player=n;
 if(topic)return begin(topic);
 $("hello").textContent=`Chào ${n}! (Lớp ${grade})`;
 $("topics").innerHTML=TOPICS.map(t=>`<button type="button" data-t="${t[0]}"><i>${t[1]}</i>${t[2]}</button>`).join("");
 document.querySelectorAll("#topics button").forEach(b=>b.onclick=()=>begin(b.dataset.t));
 showS("menu");
}
$("go").onclick=()=>tryStart();
$("name").addEventListener("keydown",e=>{if(e.key==="Enter")tryStart()});
document.querySelectorAll(".fb").forEach(b=>b.onclick=()=>tryStart(b.dataset.t));
$("close1").onclick=closeOv;$("quit").onclick=closeOv;$("home").onclick=closeOv;
$("again").onclick=()=>tryStart();

function begin(t){
 topic=t;qs=[];const keys=["calc","unknown","units","word"];
 for(let i=0;i<10;i++){const k=t==="mix"?keys[i%4]:t;qs.push(G[k](grade))}
 idx=0;score=0;right=0;streak=0;showS("play");next();
}
function next(){
 clearInterval(tmr);locked=false;
 if(idx>=qs.length)return finish();
 const q=qs[idx];left=20;
 $("pi").textContent=`Câu ${idx+1}/10`;$("ps").textContent=`⭐ ${score}`;$("pt").textContent=`⏱ ${left}s`;
 $("pb").style.width=(idx/10*100)+"%";$("pq").textContent=q.q;$("pf").textContent="";
 $("po").innerHTML=q.o.map(v=>`<button type="button" data-v="${v}">${v.toLocaleString("vi-VN")}</button>`).join("");
 document.querySelectorAll("#po button").forEach(b=>b.onclick=()=>answer(+b.dataset.v,b));
 tmr=setInterval(()=>{left--;$("pt").textContent=`⏱ ${left}s`;if(left<=0)answer(null)},1000);
}
function answer(v,btn){
 if(locked)return;locked=true;clearInterval(tmr);
 const q=qs[idx],ok=v===q.a;
 document.querySelectorAll("#po button").forEach(b=>{if(+b.dataset.v===q.a)b.classList.add("ok")});
 if(ok){streak++;right++;const g=100+left*5+Math.min(streak-1,5)*20;score+=g;$("pf").textContent=`Chính xác! +${g} điểm`}
 else{streak=0;if(btn)btn.classList.add("no");$("pf").textContent=(v===null?"Hết giờ! ":"Chưa đúng. ")+`Đáp án: ${q.a.toLocaleString("vi-VN")}`}
 $("ps").textContent=`⭐ ${score}`;
 setTimeout(()=>{if(!$("ov").classList.contains("on"))return;idx++;next()},1300);
}
function finish(){
 const base=loadLB(),rank=1+base.filter(p=>p.s>score).length;
 lastKey=player+grade+score;
 if(db&&online){
  db.collection("scores").add({name:player,grade:grade,score:score,correct:right,topic:topic,createdAt:firebase.firestore.FieldValue.serverTimestamp()}).catch(e=>console.error("Firebase:",e));
 }else{const l=base.slice();l.push({n:player,g:grade,s:score});l.sort((a,b)=>b.s-a.s);saveLB(l.slice(0,20))}
 $("rs").textContent=score.toLocaleString("en-US");
 $("rt").textContent=`${player} trả lời đúng ${right}/10 câu. `+(rank<=20?`Hạng ${rank} trên bảng xếp hạng.`:"Cố gắng thêm để vào Top 20 nhé!");
 showS("res");
}
function setSt(){const e=$("st");e.textContent=online?"● Online":"● Lưu trên máy";e.style.color=online?"#2be28a":"#8fa8d8"}
function initDB(){
 try{
  if(!FIREBASE_CONFIG.apiKey||typeof firebase==="undefined"){setSt();return}
  if(!firebase.apps.length)firebase.initializeApp(FIREBASE_CONFIG);
  db=firebase.firestore();
  db.collection("scores").orderBy("score","desc").limit(20).onSnapshot(snap=>{
   cache=snap.docs.map(d=>{const x=d.data();return{n:String(x.name||""),g:+x.grade||0,s:+x.score||0}});
   online=true;setSt();renderLB();
  },err=>{console.error("Firebase:",err);online=false;cache=null;setSt();renderLB()});
 }catch(e){console.error(e);online=false;setSt()}
}
renderLB();
initDB();
</script>
