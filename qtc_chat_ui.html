<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QTC AI - Trợ lý thông minh</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --chat-bg: #1e293b;
            --primary-color: #38bdf8;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --user-msg-bg: #0ea5e9;
            --bot-msg-bg: #334155;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        #chat-container {
            width: 100%;
            max-width: 500px;
            height: 90vh;
            background: var(--chat-bg);
            display: flex;
            flex-direction: column;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255,255,255,0.1);
            position: relative;
        }

        /* Header */
        .chat-header {
            padding: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .status-dot {
            width: 10px; height: 10px;
            background: #22c55e;
            border-radius: 50%;
            box-shadow: 0 0 10px #22c55e;
        }
        .header-info h2 { font-size: 18px; font-weight: 600; }
        .header-info p { font-size: 12px; color: var(--text-dim); }

        /* Messages */
        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            scrollbar-width: thin;
            scrollbar-color: rgba(255,255,255,0.1) transparent;
        }
        .msg {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 14px;
            line-height: 1.5;
            position: relative;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .user-msg {
            align-self: flex-end;
            background: var(--user-msg-bg);
            color: white;
            border-bottom-right-radius: 4px;
        }
        .bot-msg {
            align-self: flex-start;
            background: var(--bot-msg-bg);
            color: var(--text-main);
            border-bottom-left-radius: 4px;
        }

        /* Typing indicator */
        .typing {
            font-style: italic;
            color: var(--text-dim);
            font-size: 12px;
            margin-bottom: 8px;
            display: none;
        }

        /* Input area */
        .input-area {
            padding: 20px;
            background: rgba(0,0,0,0.2);
            display: flex;
            gap: 10px;
            border-bottom-left-radius: 24px;
            border-bottom-right-radius: 24px;
        }
        input {
            flex: 1;
            background: #0f172a;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 12px 16px;
            color: white;
            outline: none;
            transition: border 0.3s;
        }
        input:focus { border-color: var(--primary-color); }
        button {
            background: var(--primary-color);
            color: #0f172a;
            border: none;
            padding: 0 20px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }
        button:hover { transform: scale(1.05); }
        button:active { transform: scale(0.95); }

    </style>
</head>
<body>

    <div id="chat-container">
        <div class="chat-header">
            <div class="status-dot"></div>
            <div class="header-info">
                <h2>QTC AI Agent</h2>
                <p>Hỗ trợ doanh nghiệp & giáo dục</p>
            </div>
        </div>

        <div id="messages">
            <div class="msg bot-msg">Xin chào anh Quốc! Em là trợ lý AI chính chủ của anh đây. Anh muốn thiết kế em trông như thế nào ạ? 😊</div>
        </div>

        <div id="typing" class="typing" style="margin-left: 20px;">AI đang suy nghĩ...</div>

        <form class="input-area" id="chat-form">
            <input type="text" id="user-input" placeholder="Nhập tin nhắn..." autocomplete="off">
            <button type="submit">Gửi</button>
        </form>
    </div>

    <script>
        const form = document.getElementById('chat-form');
        const input = document.getElementById('user-input');
        const messages = document.getElementById('messages');
        const typing = document.getElementById('typing');

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const text = input.value.trim();
            if (!text) return;

            // Add user message
            addMessage(text, 'user-msg');
            input.value = '';

            // Show typing
            typing.style.display = 'block';
            messages.scrollTop = messages.scrollHeight;

            // Simulate AI response (Sau này sẽ gọi API xịn kết nối vào em)
            setTimeout(() => {
                typing.style.display = 'none';
                addMessage('Đây là giao diện Chat AI "hàng nhà làm" siêu mượt mà anh muốn. Sau khi kết nối API, em sẽ trả lời anh tại đây tẹt ga không giới hạn!', 'bot-msg');
            }, 1500);
        });

        function addMessage(text, className) {
            const div = document.createElement('div');
            div.className = `msg ${className}`;
            div.textContent = text;
            messages.appendChild(div);
            messages.scrollTop = messages.scrollHeight;
        }
    </script>
</body>
</html>
