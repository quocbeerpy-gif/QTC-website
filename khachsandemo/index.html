<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#12403A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Khách sạn">
<title>Quản lý khách sạn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F1F4F3;--surface:#FFFFFF;--surface2:#E8EEEC;--ink:#10221F;--ink2:#465955;--ink3:#6B7C77;--line:#D9E1DE;
  --brand:#12403A;--on-brand:#FFFFFF;--brass:#B0802A;--hero:#12403A;
  --avail:#22795A;--avail-bg:#DCF0E6;--occ:#2D68B0;--occ-bg:#DDE9F7;--dirty:#A96A0C;--dirty-bg:#F8EAD2;
  --maint:#B5402F;--maint-bg:#F7DDD8;--arr:#6B48A8;--arr-bg:#E9E0F5;
  --room:#12403A;--svc:#C08A2C;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0C1513;--surface:#152220;--surface2:#1D2D2A;--ink:#E9F1EE;--ink2:#A9BBB6;--ink3:#7F918C;--line:#263733;
    --brand:#5BC8AC;--on-brand:#06211B;--brass:#D9A84E;--hero:#173630;
    --avail:#4CC494;--avail-bg:#16382D;--occ:#7CB0EE;--occ-bg:#182F4A;--dirty:#E4A23E;--dirty-bg:#3C2E14;
    --maint:#EC7A69;--maint-bg:#42201B;--arr:#B79CEB;--arr-bg:#2C2144;
    --room:#5BC8AC;--svc:#D9A84E;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1513;--surface:#152220;--surface2:#1D2D2A;--ink:#E9F1EE;--ink2:#A9BBB6;--ink3:#7F918C;--line:#263733;
  --brand:#5BC8AC;--on-brand:#06211B;--brass:#D9A84E;--hero:#173630;
  --avail:#4CC494;--avail-bg:#16382D;--occ:#7CB0EE;--occ-bg:#182F4A;--dirty:#E4A23E;--dirty-bg:#3C2E14;
  --maint:#EC7A69;--maint-bg:#42201B;--arr:#B79CEB;--arr-bg:#2C2144;
  --room:#5BC8AC;--svc:#D9A84E;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.45 'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
svg{flex:none}
#app{max-width:480px;margin:0 auto;min-height:100dvh;padding-bottom:calc(84px + env(safe-area-inset-bottom))}

/* header */
.top{position:sticky;top:0;z-index:20;background:var(--bg);padding:calc(env(safe-area-inset-top) + 12px) 16px 10px;display:flex;align-items:center;gap:10px;min-height:60px}
.top .ttl{flex:1;min-width:0}
.top .h{font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .d{font-size:12.5px;color:var(--ink3)}
.ib{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink)}
.pt{font-size:22px;font-weight:700;margin:6px 16px 10px;letter-spacing:-.2px}

/* nav */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:30}
.nav button{background:none;border:0;padding:6px 0 3px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;color:var(--ink3);font-weight:500;position:relative}
.nav button.on{color:var(--brand);font-weight:600}
.nav button.on::before{content:'';position:absolute;top:-7px;width:28px;height:3px;border-radius:0 0 3px 3px;background:var(--brand)}
.nav .bd{position:absolute;top:0;left:calc(50% + 6px);min-width:17px;height:17px;border-radius:9px;background:var(--maint);color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center;padding:0 4px}

/* layout */
.sec{padding:0 16px;margin-top:22px}
.sec-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px;gap:8px}
.sec-h h2{font-size:15px;font-weight:600;margin:0}
.sec-h .sub{font-size:12.5px;color:var(--ink3)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:13px 14px;border:0;border-bottom:1px solid var(--line);width:100%;background:none;text-align:left}
.row:last-child{border-bottom:0}
.row .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--surface2);color:var(--ink2)}
.row .ic.arr{background:var(--arr-bg);color:var(--arr)}.row .ic.occ{background:var(--occ-bg);color:var(--occ)}
.row .ic.dirty{background:var(--dirty-bg);color:var(--dirty)}.row .ic.maint{background:var(--maint-bg);color:var(--maint)}
.row .ic.avail{background:var(--avail-bg);color:var(--avail)}
.row .ic.rn{width:46px;font-weight:700;font-size:14px;color:var(--ink)}
.row .main{flex:1;min-width:0}
.row .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:13px;color:var(--ink2)}
.row .n{font-size:20px;font-weight:700}
.row .chev{color:var(--ink3)}
.muted{color:var(--ink3)}
.empty{padding:26px 18px;text-align:center;color:var(--ink2);font-size:14px}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}

/* pills, chips, seg */
.pill{display:inline-flex;align-items:center;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--surface2);color:var(--ink2);white-space:nowrap}
.pill.avail{background:var(--avail-bg);color:var(--avail)}.pill.occ{background:var(--occ-bg);color:var(--occ)}
.pill.dirty{background:var(--dirty-bg);color:var(--dirty)}.pill.maint{background:var(--maint-bg);color:var(--maint)}
.pill.arr{background:var(--arr-bg);color:var(--arr)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 16px 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 13px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:13.5px;font-weight:500;color:var(--ink2)}
.chip.on{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.chip b{font-weight:600;opacity:.65;margin-left:5px}
.seg{display:flex;background:var(--surface2);border-radius:12px;padding:3px;margin:0 16px 12px}
.seg button{flex:1;border:0;background:none;padding:8px 4px;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--ink2)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.1)}

/* buttons */
.btn{border:0;border-radius:13px;padding:12px 16px;font-weight:600;background:var(--brand);color:var(--on-brand);display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px}
.btn.ghost{background:var(--surface2);color:var(--ink)}
.btn.line{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.danger{background:var(--maint-bg);color:var(--maint)}
.btn.sm{padding:8px 12px;font-size:13.5px;border-radius:10px;min-height:36px}
.btn.block{width:100%;flex:1}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.acts .btn{width:100%}
.fab{position:fixed;right:max(16px,calc((100vw - 480px)/2 + 16px));bottom:calc(88px + env(safe-area-inset-bottom));z-index:25;height:54px;padding:0 20px;border-radius:27px;border:0;background:var(--brand);color:var(--on-brand);font-weight:600;display:flex;align-items:center;gap:8px;box-shadow:0 6px 18px rgba(10,30,26,.28)}

/* hero */
.hero{margin:2px 16px 0;background:var(--hero);color:#fff;border-radius:22px;padding:18px;display:grid;grid-template-columns:1fr auto;gap:14px 18px;align-items:center}
.hero-n{font-size:52px;font-weight:700;line-height:1;letter-spacing:-1.5px}
.hero-n small{font-size:24px;font-weight:600;margin-left:2px;letter-spacing:0}
.hero-t{font-size:14px;margin-top:8px;opacity:.9}
.hero-s{font-size:13px;opacity:.7}
.bl{display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.bl-row{display:flex;gap:4px}
.w{display:block;border-radius:4px;border:1.5px solid rgba(255,255,255,.5);background:transparent;flex:none}
.w.occ{background:#fff;border-color:#fff}
.w.dirty{background:#F2B24C;border-color:#F2B24C}
.w.maint{background:#F0806F;border-color:#F0806F}
.w.arr{border-color:#C7ADFF;background:radial-gradient(circle,#C7ADFF 32%,transparent 38%)}
.hero-lg{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;opacity:.9;padding-top:12px;border-top:1px solid rgba(255,255,255,.18)}
.hero-lg span{display:inline-flex;align-items:center;gap:6px}
.hero-lg .w{width:11px;height:11px;border-radius:3px}
.banner{margin:12px 16px 0;padding:12px 14px;border-radius:14px;background:var(--surface);border:1px dashed var(--brass);font-size:13.5px;display:flex;gap:12px;align-items:center}
.banner div{flex:1;color:var(--ink2)}

/* kpis */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.kpi{background:var(--surface);padding:13px 14px}
.kpi .l{font-size:12.5px;color:var(--ink3)}
.kpi .v{font-size:20px;font-weight:700;margin-top:1px;letter-spacing:-.3px}
.kpi .d{font-size:12px;color:var(--ink2);margin-top:1px}
.kpis.three{grid-template-columns:1fr 1fr 1fr}.kpis.three .v{font-size:17px}

/* rooms */
.floor{margin:16px 0 8px;font-size:13px;color:var(--ink2);font-weight:600;display:flex;align-items:center;gap:10px}
.floor::after{content:'';flex:1;height:1px;background:var(--line)}
.tags{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tag{--c:var(--avail);position:relative;text-align:left;background:var(--surface);border-radius:12px 12px 16px 16px;padding:20px 8px 9px;border:1px solid var(--line);border-bottom:5px solid var(--c);min-height:100px;display:block;width:100%}
.tag::before{content:'';position:absolute;top:7px;left:50%;width:9px;height:9px;margin-left:-4.5px;border-radius:50%;background:var(--bg);box-shadow:inset 0 0 0 2px var(--c)}
.tag .no{font-size:23px;font-weight:700;line-height:1;text-align:center}
.tag .ty{font-size:11.5px;color:var(--ink3);text-align:center;margin-top:3px}
.tag .st{font-size:12.5px;font-weight:600;color:var(--c);text-align:center;margin-top:7px}
.tag .sm{font-size:11.5px;color:var(--ink2);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:16px}
.tag.occ{--c:var(--occ);background:var(--occ-bg)}
.tag.dirty{--c:var(--dirty);background:var(--dirty-bg)}
.tag.maint{--c:var(--maint);background:var(--maint-bg)}
.tag.arr{--c:var(--arr);background:var(--arr-bg)}
.tag.avail .st{color:var(--avail)}

/* search */
.search{position:relative;margin:0 16px 10px}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--ink3)}
.search input{width:100%;padding:12px 14px 12px 40px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-size:16px}
.grp{margin:14px 16px 8px;font-size:13px;color:var(--ink2);font-weight:600}
.bk .main .t{display:flex;gap:8px;align-items:center}
.bk .r{text-align:right;flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.bk .r .due{font-size:12px;color:var(--maint);font-weight:600}

/* charts */
.chart{width:100%;height:auto;display:block}
.chart text{font:500 10px 'Be Vietnam Pro',system-ui,sans-serif;fill:var(--ink3)}
.chart .val{fill:var(--ink2);font-weight:600}
.lg{display:flex;gap:14px;font-size:12.5px;color:var(--ink2);margin-bottom:6px;flex-wrap:wrap}
.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.split{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--surface2);margin:12px 0 8px}
.split i{display:block;height:100%}
.big{font-size:30px;font-weight:700;letter-spacing:-.6px;line-height:1.1}
.hb{display:grid;grid-template-columns:1fr auto;gap:2px 10px;margin-bottom:11px;font-size:13.5px}
.hb .t{grid-column:1/-1;height:7px;border-radius:4px;background:var(--surface2);overflow:hidden}
.hb .t i{display:block;height:100%;border-radius:4px;background:var(--room)}
.hb .v{font-weight:600}
.hb .l{color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dn{display:flex;gap:16px;align-items:center}
.dn ul{list-style:none;margin:0;padding:0;flex:1;font-size:13px}
.dn li{display:flex;align-items:center;gap:8px;padding:3px 0}
.dn li span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dn li i{width:10px;height:10px;border-radius:3px;flex:none}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font-weight:500;color:var(--ink3);text-align:right;padding:6px 6px;position:sticky;top:0;background:var(--surface)}
.tbl td{text-align:right;padding:8px 6px;border-top:1px solid var(--line)}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.scrollx{max-height:340px;overflow:auto}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(6,16,14,.5);z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,104%);width:100%;max-width:480px;max-height:92dvh;background:var(--surface);border-radius:22px 22px 0 0;z-index:51;display:flex;flex-direction:column;transition:transform .26s cubic-bezier(.2,.8,.2,1)}
.sheet.on{transform:translate(-50%,0)}
.sheet-h{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 6px 20px;gap:10px}
.sheet-h h3{margin:0;font-size:18px;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet-b{overflow:auto;padding:6px 20px 20px;-webkit-overflow-scrolling:touch;flex:1}
.sheet-f{padding:12px 20px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;gap:10px}
.sheet-f:empty{display:none}
.dlg-wrap{position:fixed;inset:0;background:rgba(6,16,14,.55);z-index:70;display:none;align-items:center;justify-content:center;padding:24px}
.dlg-wrap.on{display:flex}
.dlg{background:var(--surface);border-radius:20px;padding:20px;max-width:360px;width:100%}
.dlg p{margin:0 0 16px;font-size:15px}
.dlg-b{display:flex;gap:10px}.dlg-b .btn{flex:1}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;font-size:14px;font-weight:500;z-index:80;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:min(92vw,440px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast.err{background:var(--maint);color:#fff}

/* forms */
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.fld{grid-column:1/-1;margin-bottom:12px}
.fld.half{grid-column:auto}
.fld label{display:block;font-size:13px;color:var(--ink2);margin-bottom:5px;font-weight:500}
.inp{width:100%;padding:12px 13px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-size:16px;min-height:46px}
textarea.inp{resize:vertical}
.inp:focus{outline:2px solid var(--brand);outline-offset:0;border-color:transparent}
.hint{font-size:12.5px;color:var(--ink3);margin-top:4px}
.err{grid-column:1/-1;background:var(--maint-bg);color:var(--maint);padding:10px 12px;border-radius:10px;font-size:13.5px;font-weight:500;margin-bottom:8px}
.sum{grid-column:1/-1;background:var(--surface2);border-radius:12px;padding:10px 12px;font-size:13.5px;margin-bottom:12px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px;margin:8px 0 4px}
.kv dt{color:var(--ink3)}.kv dd{margin:0;text-align:right;font-weight:500;overflow-wrap:anywhere}
.kv a{color:var(--brand)}
.bill{margin-top:16px;border-top:1px solid var(--line)}
.bill .b{display:flex;justify-content:space-between;gap:12px;padding:7px 0;font-size:14px;border-bottom:1px solid var(--line)}
.bill .b span:first-child{color:var(--ink2);min-width:0;overflow-wrap:anywhere}
.bill .b.tot{font-weight:700;font-size:15px}
.bill .b.due{font-weight:700;color:var(--maint);border-bottom:0}
.bill .b.ok{font-weight:600;color:var(--avail);border-bottom:0}
.x{border:0;background:none;color:var(--ink3);padding:0 4px;margin-left:6px;vertical-align:middle}
.h3{font-size:14px;font-weight:600;margin:18px 0 4px}
.setrow .s{max-width:100%}
.tagchip{display:inline-flex;align-items:center;gap:4px;padding:6px 8px 6px 12px;border-radius:99px;background:var(--surface2);font-size:13.5px;margin:0 6px 8px 0}
.note{padding:12px 14px;border-bottom:1px solid var(--line)}
.note:last-child{border-bottom:0}
.note .m{font-size:12.5px;color:var(--ink3);margin-bottom:2px}
.net{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:5px 10px;border-radius:99px;background:var(--surface);border:1px solid var(--line);color:var(--ink2);white-space:nowrap}
.net i{width:8px;height:8px;border-radius:50%;background:var(--avail)}
.net.off i{background:var(--dirty)}.net.sync i{background:var(--occ)}
.gate{max-width:420px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 56px) 24px 40px}
.gate-i{width:64px;height:64px;border-radius:20px;background:var(--hero);color:#fff;display:grid;place-items:center;margin-bottom:22px}
.gate h1{font-size:26px;margin:0 0 8px;letter-spacing:-.4px}
.gate p{margin:0 0 20px;color:var(--ink2)}
.gate .btn{width:100%;margin-bottom:10px}
.gate .err{display:block}
.link{background:none;border:0;color:var(--brand);font-weight:600;padding:10px 0;font-size:14px}
.spin{width:24px;height:24px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--brand);animation:sp .8s linear infinite;margin-top:4px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app">
  <header class="top" id="top"></header>
  <main id="view"><div class="gate"><h1>Đang tải ứng dụng</h1><p>Nếu màn hình này không đổi sau vài giây, hãy kiểm tra kết nối mạng rồi tải lại trang.</p></div></main>
</div>
<nav class="nav" id="nav" aria-label="Điều hướng chính"></nav>
<div class="scrim" id="scrim" data-a="close"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-t">
  <div class="sheet-h"><h3 id="sh-t"></h3><button class="ib" data-a="close" aria-label="Đóng"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
  <div class="sheet-b" id="sh-b"></div>
  <div class="sheet-f" id="sh-f"></div>
</div>
<div class="dlg-wrap" id="dlg"></div>
<div class="toast" id="toast" role="status"></div>
<noscript>Ứng dụng cần bật JavaScript để hoạt động.</noscript>

<script type="module">

function startSync(){
  stopSync();

  const step=(k,changed)=>{
    if(!loaded.has(k)){loaded.add(k);if(loaded.size===need){cloudReady=true;ui.auth=(configExists||S.rooms.length||S.bookings.length)?'app':'setup';render();}}

  };

    const prev=cloud.config;configExists=snap.exists();
    if(configExists){const d=snap.data();cloud.config=canon(clean({settings:d.settings||{},demo:!!d.demo}));applyConfig(d);}else cloud.config=null;
    step('config',prev!==cloud.config);
  },errHandler));
  COLLS.forEach(name=>unsubs.push(onSnapshot(collection(db,name),snap=>{
    const docs=[],m=new Map();
    snap.forEach(d=>{const data=clean(d.data());data.id=d.id;docs.push(data);const rest=Object.assign({},data);delete rest.id;m.set(d.id,canon(rest));});
    const prev=cloud[name];
    const same=!!prev&&prev.size===m.size&&[...m].every(([k,v])=>prev.get(k)===v);
    cloud[name]=m;
    if(!same||!loaded.has(name)){const arr=mergeInPlace(S[name],docs);if(SORT[name])arr.sort(SORT[name]);S[name]=arr;}

  },errHandler)));

function syncCloud(){
  if(!db||!cloudReady||ui.auth!=='app')return;
  const ops=[];
  COLLS.forEach(name=>{
    const known=cloud[name]||new Map(),cur=new Set();
    S[name].forEach(o=>{
      cur.add(o.id);const rest=clean(o);delete rest.id;const c=canon(rest);
      if(known.get(o.id)!==c){ops.push({r:doc(db,name,o.id),d:rest});known.set(o.id,c);}
    });
    [...known.keys()].forEach(id=>{if(!cur.has(id)){ops.push({r:doc(db,name,id)});known.delete(id);}});
    cloud[name]=known;
  });
  const cfg=clean({settings:S.settings,demo:!!S.demo}),cc=canon(cfg);
  if(cloud.config!==cc){ops.push({r:doc(db,'config','main'),d:cfg});cloud.config=cc;}
  for(let i=0;i<ops.length;i+=400){
    const b=writeBatch(db);ops.slice(i,i+400).forEach(o=>{if(o.d)b.set(o.r,o.d);else b.delete(o.r);});
    inflight++;
    b.commit().then(()=>{inflight=Math.max(0,inflight-1);ui.pending=inflight>0;renderTopSafe();}).catch(e=>{inflight=Math.max(0,inflight-1);ui.pending=inflight>0;toast(e&&e.code==='permission-denied'?'Tài khoản không có quyền ghi dữ liệu.':'Chưa lưu được lên máy chủ, hãy kiểm tra mạng.',true);renderTopSafe();});

}

function calcBill(b,cfg){
  cfg=cfg||S.settings;
  const nights=Math.max(1,diffDays(b.checkIn,b.checkOut));
  const room=nights*b.rate;
  const svc=(b.charges||[]).reduce((s,c)=>s+c.qty*c.price,0);
  const sub=room+svc;
  const fee=Math.round(sub*(cfg.servicePct||0)/100);
  const vat=Math.round((sub+fee)*(cfg.taxPct||0)/100);
  const total=sub+fee+vat;
  const paid=(b.payments||[]).reduce((s,p)=>s+p.amount,0);
  return {nights,room,svc,sub,fee,vat,total,paid,balance:total-paid};
}

      if(status==='in'||status==='out'){const k=Math.floor(R()*4);for(let i=0;i<k;i++){const s=pick(services),dt=addDays(ci,Math.floor(R()*n));if(dt<=t0)b.charges.push({id:uid(),name:s.name,qty:1+Math.floor(R()*2),price:s.price,date:dt});}}

      bookings.push(b);d+=n;
    }
  });
  const mr=rooms.find(r=>r.no==='306');
  if(mr){bookings=bookings.filter(b=>!(b.roomId===mr.id&&(b.status==='in'||b.status==='reserved')));mr.status='maint';}

  rooms.forEach(r=>{
    if(r===mr)return;

    const outToday=bookings.some(b=>b.roomId===r.id&&b.status==='out'&&b.checkOut===t0);

function roomState(r){
  const t=today();
  const b=S.bookings.find(x=>x.roomId===r.id&&x.status==='in');
  if(b)return {k:'occ',label:'Có khách',b};
  if(r.status==='maint')return {k:'maint',label:'Bảo trì'};
  if(r.status==='dirty')return {k:'dirty',label:'Chờ dọn'};
  const a=S.bookings.find(x=>x.roomId===r.id&&x.status==='reserved'&&x.checkIn<=t&&x.checkOut>t);
  if(a)return {k:'arr',label:'Sắp đến',b:a};
  return {k:'avail',label:'Trống'};
}
const effEnd=b=>(b.status==='in'&&b.checkOut<=today())?addDays(today(),1):b.checkOut;
function roomFree(roomId,ci,co,ignoreId){
  return !S.bookings.some(b=>b.id!==ignoreId&&b.roomId===roomId&&(b.status==='reserved'||b.status==='in')&&b.checkIn<co&&ci<effEnd(b));
}
function dayStats(d,withReserved){
  let sold=0,room=0,svc=0;
  for(const b of S.bookings){
    if(b.status==='cancelled')continue;
    const live=b.status==='in'||b.status==='out';
    if((live||(withReserved&&b.status==='reserved'))&&b.checkIn<=d&&d<b.checkOut){sold++;room+=b.rate;}
    if(live)for(const c of b.charges||[])if(c.date===d)svc+=c.qty*c.price;
  }
  const total=S.rooms.length;
  return {sold,room,svc,rev:room+svc,occ:total?sold/total*100:0,adr:sold?room/sold:0,revpar:total?room/total:0};
}
function addCleanTask(r,title){
  if(S.tasks.some(t=>t.type==='clean'&&t.roomId===r.id&&t.status!=='done'))return;
  S.tasks.push({id:uid(),type:'clean',roomId:r.id,title:title||'Dọn phòng',note:'',priority:'mid',assignee:'',status:'open',createdAt:nowISO(),lock:false});
}

function niceMax(v){const p=Math.pow(10,Math.floor(Math.log10(v)));const n=v/p;const m=n<=1?1:n<=2?2:n<=4?4:n<=6?6:n<=8?8:10;return m*p;}
function barChart(items,o){
  o=o||{};const fmt=o.fmt||fmtShort,colors=o.colors||['var(--room)','var(--svc)'],W=340,H=o.h||150,padL=36,padB=20,padT=16,cw=W-padL-6,ch=H-padB-padT;
  const totals=items.map(i=>i.v.reduce((a,b)=>a+b,0));
  const max=o.max||niceMax(Math.max(1,Math.max.apply(null,totals)));
  const bw=cw/items.length,step=Math.ceil(items.length/(o.labels||8));
  let s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(o.aria||'Biểu đồ cột')+'">';
  for(let g=0;g<=2;g++){const y=padT+ch-ch*g/2;s+='<line x1="'+padL+'" x2="'+(W-6)+'" y1="'+y+'" y2="'+y+'" stroke="var(--line)"/><text x="'+(padL-6)+'" y="'+(y+3)+'" text-anchor="end">'+fmt(max*g/2)+'</text>';}
  items.forEach((it,i)=>{
    let y=padT+ch;const x=padL+i*bw+bw*0.15,w=bw*0.7;
    it.v.forEach((v,j)=>{const hh=v/max*ch;if(hh>0){y-=hh;s+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+w.toFixed(1)+'" height="'+hh.toFixed(1)+'" rx="'+(it.v.length===1?3:0)+'" fill="'+colors[j]+'"'+(it.dim?' opacity=".55"':'')+'/>';}});
    if(o.vals&&totals[i]>0)s+='<text class="val" x="'+(x+w/2).toFixed(1)+'" y="'+(y-4).toFixed(1)+'" text-anchor="middle">'+fmt(totals[i])+'</text>';
    if(i%step===0)s+='<text x="'+(x+w/2).toFixed(1)+'" y="'+(H-5)+'" text-anchor="middle">'+esc(it.l)+'</text>';
  });
  return s+'</svg>';
}
function lineChart(vals,labels,o){
  o=o||{};const max=o.max||100,fmt=o.fmt||(v=>Math.round(v)+'%'),W=340,H=o.h||140,padL=36,padB=20,padT=12,cw=W-padL-10,ch=H-padB-padT,n=vals.length;
  const x=i=>padL+(n===1?cw/2:i*cw/(n-1)),y=v=>padT+ch-Math.min(v,max)/max*ch;
  let s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(o.aria||'Biểu đồ đường')+'">';
  for(let g=0;g<=2;g++){const yy=padT+ch-ch*g/2;s+='<line x1="'+padL+'" x2="'+(W-6)+'" y1="'+yy+'" y2="'+yy+'" stroke="var(--line)"/><text x="'+(padL-6)+'" y="'+(yy+3)+'" text-anchor="end">'+fmt(max*g/2)+'</text>';}
  const pts=vals.map((v,i)=>x(i).toFixed(1)+','+y(v).toFixed(1));
  s+='<path d="M'+x(0).toFixed(1)+','+(padT+ch)+' L'+pts.join(' L')+' L'+x(n-1).toFixed(1)+','+(padT+ch)+'Z" fill="var(--room)" opacity=".13"/>';
  s+='<polyline points="'+pts.join(' ')+'" fill="none" stroke="var(--room)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
  const step=Math.ceil(n/6);labels.forEach((l,i)=>{if(i%step===0)s+='<text x="'+x(i).toFixed(1)+'" y="'+(H-5)+'" text-anchor="middle">'+esc(l)+'</text>';});
  return s+'</svg>';
}
function donut(segs){
  const r=44,c=2*Math.PI*r,tot=segs.reduce((a,s)=>a+s.v,0)||1;let off=0;
  let s='<svg viewBox="0 0 120 120" width="118" height="118" role="img" aria-label="Biểu đồ tròn"><circle cx="60" cy="60" r="'+r+'" fill="none" stroke="var(--surface2)" stroke-width="16"/>';
  segs.forEach(g=>{const len=g.v/tot*c;if(len>0)s+='<circle cx="60" cy="60" r="'+r+'" fill="none" stroke="'+g.c+'" stroke-width="16" stroke-dasharray="'+len.toFixed(2)+' '+(c-len).toFixed(2)+'" stroke-dashoffset="'+(-off).toFixed(2)+'" transform="rotate(-90 60 60)"/>';off+=len;});
  return s+'</svg>';
}
function hbars(list){
  const max=Math.max(1,Math.max.apply(null,list.map(x=>x.v)));
  return list.map(x=>'<div class="hb"><span class="l">'+esc(x.l)+'</span><span class="v">'+esc(x.t)+'</span><div class="t"><i style="width:'+Math.max(2,x.v/max*100).toFixed(1)+'%"></i></div></div>').join('');
}

  const fut=Array.from({length:7},(_,i)=>{const d=addDays(t,i),s=dayStats(d,true);return {l:i===0?'Nay':WD[parse(d).getDay()],v:[Math.round(s.occ)]};});
  h+='<div class="sec"><div class="sec-h"><h2>Công suất dự kiến 7 ngày tới</h2></div><div class="panel">'+barChart(fut,{max:100,fmt:v=>Math.round(v)+'%',colors:['var(--occ)'],vals:true,aria:'Công suất phòng dự kiến'})+'</div></div>';
  h+='<div class="sec"><div class="sec-h"><h2>Hoạt động gần đây</h2></div>'+(S.log.length?'<div class="list">'+S.log.slice(0,6).map(l=>'<div class="note"><div class="m">'+fmtDT(l.t)+(l.u?', '+esc(String(l.u).split('@')[0]):'')+'</div>'+esc(l.text)+'</div>').join('')+'</div>':'<div class="list"><div class="empty">Chưa có hoạt động nào. Nhận phòng, trả phòng và thu tiền sẽ hiện ở đây.</div></div>')+'</div>';
  return h;
}

/* ---- Rooms ---- */
function tagHTML(r){
  const s=roomState(r),ty=typeOf(r.typeId);
  const sm=(s.k==='occ'||s.k==='arr')?short(s.b.guest):'';
  return '<button class="tag '+s.k+'" data-a="room" data-id="'+r.id+'"><div class="no">'+esc(r.no)+'</div><div class="ty">'+esc(ty?ty.name:'')+'</div><div class="st">'+s.label+'</div><div class="sm">'+esc(sm)+'</div></button>';
}
function viewRooms(){
  const all=sortedRooms(),st=all.map(r=>({r,k:roomState(r).k}));
  const C=k=>k==='all'?all.length:st.filter(x=>x.k===k).length;
  const fl=[['all','Tất cả'],['avail','Trống'],['occ','Có khách'],['arr','Sắp đến'],['dirty','Chờ dọn'],['maint','Bảo trì']];
  let h='<h1 class="pt">Phòng</h1><div class="chips">'+fl.map(f=>'<button class="chip'+(ui.roomFilter===f[0]?' on':'')+'" data-a="rFilter" data-f="'+f[0]+'">'+f[1]+'<b>'+C(f[0])+'</b></button>').join('')+'</div><div class="sec" style="margin-top:0">';
  const list=st.filter(x=>ui.roomFilter==='all'||x.k===ui.roomFilter).map(x=>x.r);
  if(!all.length)return h+'<div class="list"><div class="empty"><b>Chưa có phòng</b>Vào Cài đặt, mục Danh sách phòng để thêm phòng.</div></div><div style="margin-top:12px"><button class="btn block" data-a="openSettings">Mở cài đặt</button></div></div>';
  if(!list.length)return h+'<div class="list"><div class="empty">Không có phòng nào ở trạng thái này.</div></div></div>';
  const floors=[...new Set(list.map(r=>r.floor))].sort((a,b)=>a-b);
  floors.forEach(f=>{h+='<div class="floor">Tầng '+f+'</div><div class="tags">'+list.filter(r=>r.floor===f).map(tagHTML).join('')+'</div>';});
  return h+'</div>';
}
function openRoom(id){
  const r=roomOf(id);if(!r)return;

  let body='<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:4px 0 6px"><span class="pill '+s.k+'">'+s.label+'</span><span class="muted" style="font-size:13.5px">'+esc(ty?ty.name:'')+', tầng '+r.floor+', tối đa '+(ty?ty.cap:'?')+' khách</span></div>';
  if(ty)body+='<div class="muted" style="font-size:13.5px">Giá niêm yết '+money(ty.price)+' mỗi đêm'+(ty.desc?'. '+esc(ty.desc):'')+'</div>';
  let acts='';
  if(s.b){
    const bl=calcBill(s.b);
    body+='<div class="h3">'+(s.k==='occ'?'Khách đang ở':'Khách sắp đến')+'</div><button class="row" style="border:1px solid var(--line);border-radius:14px" data-a="book" data-id="'+s.b.id+'"><span class="main"><div class="t">'+esc(s.b.guest)+'</div><div class="s">'+dm(s.b.checkIn)+' đến '+dm(s.b.checkOut)+', '+bl.nights+' đêm</div></span>'+(bl.balance>0?'<span class="pill maint">Còn '+fmtShort(bl.balance)+'</span>':'<span class="pill avail">Đã thanh toán</span>')+'<span class="chev">'+ic('chevR',18)+'</span></button>';
  }
  if(s.k==='occ')acts='<button class="btn" data-a="checkout" data-id="'+s.b.id+'">'+ic('logout',18)+'Trả phòng</button><button class="btn ghost" data-a="addCharge" data-id="'+s.b.id+'">'+ic('plus',18)+'Thêm dịch vụ</button><button class="btn line" data-a="roomIssue" data-id="'+r.id+'">'+ic('wrench',18)+'Báo sự cố</button>';
  else if(s.k==='arr')acts='<button class="btn" data-a="checkin" data-id="'+s.b.id+'">'+ic('login',18)+'Nhận phòng</button><button class="btn ghost" data-a="newBook" data-room="'+r.id+'">'+ic('plus',18)+'Đặt phòng mới</button><button class="btn line" data-a="roomDirty" data-id="'+r.id+'">Đánh dấu chờ dọn</button><button class="btn line" data-a="roomIssue" data-id="'+r.id+'">'+ic('wrench',18)+'Báo sự cố</button>';
  else if(s.k==='avail')acts='<button class="btn" data-a="newBook" data-room="'+r.id+'">'+ic('plus',18)+'Đặt phòng</button><button class="btn ghost" data-a="roomDirty" data-id="'+r.id+'">Đánh dấu chờ dọn</button><button class="btn line" data-a="roomIssue" data-id="'+r.id+'">'+ic('wrench',18)+'Báo sự cố</button>';
  else if(s.k==='dirty')acts='<button class="btn" data-a="roomClean" data-id="'+r.id+'">'+ic('check',18)+'Đã dọn xong</button><button class="btn ghost" data-a="roomIssue" data-id="'+r.id+'">'+ic('wrench',18)+'Báo sự cố</button>';
  else if(s.k==='maint')acts='<button class="btn" data-a="roomFix" data-id="'+r.id+'">'+ic('check',18)+'Hoàn tất bảo trì</button><button class="btn ghost" data-a="roomIssue" data-id="'+r.id+'">Thêm sự cố</button>';
  body+='<div class="acts">'+acts+'</div>';
  const up=S.bookings.filter(b=>b.roomId===r.id&&b.status==='reserved'&&(!s.b||b.id!==s.b.id)).sort((a,b)=>a.checkIn.localeCompare(b.checkIn)).slice(0,4);
  if(up.length)body+='<div class="h3">Lịch đặt sắp tới</div><div class="list">'+up.map(b=>'<button class="row" data-a="book" data-id="'+b.id+'"><span class="main"><div class="t">'+esc(b.guest)+'</div><div class="s">'+dm(b.checkIn)+' đến '+dm(b.checkOut)+'</div></span><span class="chev">'+ic('chevR',18)+'</span></button>').join('')+'</div>';
  const iss=S.tasks.filter(x=>x.roomId===r.id&&x.status!=='done');
  if(iss.length)body+='<div class="h3">Việc đang mở</div><div class="list">'+iss.map(taskRow).join('')+'</div>';
  openSheet({title:'Phòng '+r.no,body});
}

/* ---- Bookings ---- */
const BST={reserved:['Đã đặt','arr'],in:['Đang ở','occ'],out:['Đã trả',''],cancelled:['Đã hủy','maint']};
function bookGroups(){
  const t=today(),q=ui.q.trim().toLowerCase(),B=S.bookings;
  if(q){const l=B.filter(b=>[b.guest,b.phone,b.code,roomNo(b.roomId)].join(' ').toLowerCase().includes(q)).sort((a,b)=>b.checkIn.localeCompare(a.checkIn));return [{h:'Kết quả tìm kiếm ('+l.length+')',list:l}];}
  const f=ui.bookFilter;
  if(f==='today')return [{h:'Khách đến',list:B.filter(b=>b.status==='reserved'&&b.checkIn<=t),empty:'Không có khách chờ nhận phòng hôm nay.'},{h:'Trả phòng',list:B.filter(b=>b.status==='in'&&b.checkOut<=t),empty:'Không có phòng cần trả hôm nay.'}];
  if(f==='in')return [{list:B.filter(b=>b.status==='in').sort((a,b)=>a.checkOut.localeCompare(b.checkOut)),empty:'Hiện chưa có khách đang ở.'}];
  if(f==='res')return [{list:B.filter(b=>b.status==='reserved').sort((a,b)=>a.checkIn.localeCompare(b.checkIn)),empty:'Chưa có đặt phòng sắp tới. Nhấn nút Đặt phòng để tạo mới.'}];
  if(f==='out')return [{list:B.filter(b=>b.status==='out').sort((a,b)=>b.checkOut.localeCompare(a.checkOut)).slice(0,80),empty:'Chưa có lượt trả phòng nào.'}];
  if(f==='can')return [{list:B.filter(b=>b.status==='cancelled').sort((a,b)=>b.checkIn.localeCompare(a.checkIn)),empty:'Không có đặt phòng bị hủy.'}];
  return [{list:B.slice().sort((a,b)=>b.createdAt.localeCompare(a.createdAt)).slice(0,100),empty:'Chưa có đặt phòng nào.'}];
}
function bookRow(b){
  const bl=calcBill(b),st=BST[b.status],over=b.status==='in'&&b.checkOut<today();
  return '<button class="row bk" data-a="book" data-id="'+b.id+'"><span class="ic rn">'+esc(roomNo(b.roomId))+'</span><span class="main"><div class="t">'+esc(b.guest)+'</div><div class="s">'+dm(b.checkIn)+' đến '+dm(b.checkOut)+', '+bl.nights+' đêm</div></span><span class="r"><span class="pill '+(over?'maint':st[1])+'">'+(over?'Quá hạn':st[0])+'</span>'+((b.status==='in'||b.status==='reserved')&&bl.balance>0?'<span class="due">Còn '+fmtShort(bl.balance)+'</span>':'')+'</span></button>';
}
function bookListHTML(){
  return bookGroups().map(g=>{
    let s=g.h?'<div class="grp">'+g.h+(g.h.indexOf('Kết quả')<0?' ('+g.list.length+')':'')+'</div>':'';
    s+=g.list.length?'<div class="sec" style="margin:0"><div class="list">'+g.list.map(bookRow).join('')+'</div></div>':'<div class="sec" style="margin:0"><div class="list"><div class="empty">'+(ui.q.trim()?'Không tìm thấy đặt phòng phù hợp.':(g.empty||'Không có dữ liệu.'))+'</div></div></div>';
    return s;
  }).join('');
}
function viewBookings(){
  const t=today(),B=S.bookings;
  const C={today:B.filter(b=>(b.status==='reserved'&&b.checkIn<=t)||(b.status==='in'&&b.checkOut<=t)).length,in:B.filter(b=>b.status==='in').length,res:B.filter(b=>b.status==='reserved').length,out:B.filter(b=>b.status==='out').length,can:B.filter(b=>b.status==='cancelled').length,all:B.length};
  const fl=[['today','Hôm nay'],['in','Đang ở'],['res','Sắp đến'],['out','Đã trả'],['can','Đã hủy'],['all','Tất cả']];
  return '<h1 class="pt">Đặt phòng</h1><div class="search">'+ic('search',18)+'<input id="q" type="search" placeholder="Tìm tên khách, số điện thoại, mã, số phòng" value="'+esc(ui.q)+'" autocomplete="off"></div><div class="chips">'+fl.map(f=>'<button class="chip'+(ui.bookFilter===f[0]?' on':'')+'" data-a="bFilter" data-f="'+f[0]+'">'+f[1]+'<b>'+C[f[0]]+'</b></button>').join('')+'</div><div id="blist">'+bookListHTML()+'</div><div style="height:70px"></div>';
}
function billHTML(b,editable){
  const x=calcBill(b),cfg=S.settings;let h='<div class="bill">';
  h+='<div class="b"><span>Tiền phòng, '+x.nights+' đêm × '+nf.format(b.rate)+'</span><span>'+money(x.room)+'</span></div>';
  (b.charges||[]).forEach(c=>{h+='<div class="b"><span>'+esc(c.name)+' × '+c.qty+' <span class="muted">('+dm(c.date)+')</span>'+(editable?'<button class="x" data-a="delCharge" data-id="'+b.id+'" data-c="'+c.id+'" aria-label="Xóa dịch vụ">'+ic('x',14)+'</button>':'')+'</span><span>'+money(c.qty*c.price)+'</span></div>';});
  if(cfg.servicePct)h+='<div class="b"><span>Phí phục vụ '+cfg.servicePct+'%</span><span>'+money(x.fee)+'</span></div>';
  if(cfg.taxPct)h+='<div class="b"><span>VAT '+cfg.taxPct+'%</span><span>'+money(x.vat)+'</span></div>';
  h+='<div class="b tot"><span>Tổng cộng</span><span>'+money(x.total)+'</span></div>';
  (b.payments||[]).forEach(p=>{h+='<div class="b"><span>Đã thu, '+esc(p.method)+' <span class="muted">('+dm(p.date)+')</span></span><span>− '+money(p.amount)+'</span></div>';});
  h+=x.balance>0?'<div class="b due"><span>Còn phải thu</span><span>'+money(x.balance)+'</span></div>':(x.balance<0?'<div class="b ok"><span>Thu dư, cần hoàn lại</span><span>'+money(-x.balance)+'</span></div>':'<div class="b ok"><span>Đã thanh toán đủ</span><span>'+money(0)+'</span></div>');
  return h+'</div>';
}
function openBooking(id){
  const b=S.bookings.find(x=>x.id===id);if(!b)return;
  const st=BST[b.status],ty=typeOf(b.typeId),bl=calcBill(b);
  const tel=b.phone?'<a href="tel:'+esc(b.phone.replace(/\s/g,''))+'">'+esc(b.phone)+'</a>':'Chưa có';

   +'<dl class="kv"><dt>Phòng</dt><dd>'+esc(roomNo(b.roomId))+(ty?', '+esc(ty.name):'')+'</dd><dt>Lưu trú</dt><dd>'+dmy(b.checkIn)+' đến '+dmy(b.checkOut)+' ('+bl.nights+' đêm)</dd><dt>Số khách</dt><dd>'+b.adults+' người lớn'+(b.children?', '+b.children+' trẻ em':'')+'</dd><dt>Điện thoại</dt><dd>'+tel+'</dd>'+(b.idno?'<dt>CCCD/Hộ chiếu</dt><dd>'+esc(b.idno)+'</dd>':'')+'<dt>Nguồn</dt><dd>'+esc(b.source||'')+'</dd>'+(b.note?'<dt>Ghi chú</dt><dd>'+esc(b.note)+'</dd>':'')+'</dl>';
  body+=billHTML(b,b.status==='in'||b.status==='reserved');
  let acts='';

  if(b.status==='in')acts+='<button class="btn ghost" data-a="addCharge" data-id="'+b.id+'">'+ic('plus',18)+'Thêm dịch vụ</button><button class="btn ghost" data-a="addPay" data-id="'+b.id+'">'+ic('cash',18)+'Thu tiền</button><button class="btn ghost" data-a="editBook" data-id="'+b.id+'">'+ic('edit',18)+'Sửa</button>';
  acts+='<button class="btn ghost" data-a="copyBill" data-id="'+b.id+'">'+ic('copy',18)+'Sao chép hóa đơn</button>';
  body+='<div class="acts">'+acts+'</div>';
  let foot='';
  if(b.status==='reserved')foot='<button class="btn block" data-a="checkin" data-id="'+b.id+'">'+ic('login',18)+'Nhận phòng</button>';
  if(b.status==='in')foot='<button class="btn block" data-a="checkout" data-id="'+b.id+'">'+ic('logout',18)+'Trả phòng</button>';

function billText(b){
  const x=calcBill(b),h=S.settings.hotel,l=[];
  l.push(h.name||'Khách sạn');if(h.address)l.push(h.address);if(h.phone)l.push('ĐT: '+h.phone);
  l.push('','HÓA ĐƠN '+b.code,'Khách: '+b.guest,'Phòng '+roomNo(b.roomId)+', '+dmy(b.checkIn)+' đến '+dmy(b.checkOut)+' ('+x.nights+' đêm)','');
  l.push('Tiền phòng: '+x.nights+' × '+nf.format(b.rate)+' = '+money(x.room));
  (b.charges||[]).forEach(c=>l.push(c.name+' × '+c.qty+' = '+money(c.qty*c.price)));
  if(S.settings.servicePct)l.push('Phí phục vụ '+S.settings.servicePct+'%: '+money(x.fee));
  if(S.settings.taxPct)l.push('VAT '+S.settings.taxPct+'%: '+money(x.vat));
  l.push('TỔNG CỘNG: '+money(x.total),'Đã thu: '+money(x.paid),(x.balance>0?'CÒN PHẢI THU: ':'Còn lại: ')+money(Math.max(0,x.balance)),'','Cảm ơn quý khách!');
  return l.join('\n');
}

/* ---- Ops ---- */
function taskRow(t){
  const r=roomOf(t.roomId),who=staffOf(t.assignee);
  const st={open:['Chưa làm',''],doing:['Đang làm','occ'],done:['Xong','avail']}[t.status];
  return '<button class="row" data-a="task" data-id="'+t.id+'"><span class="ic rn">'+(r?esc(r.no):'—')+'</span><span class="main"><div class="t">'+esc(t.title)+'</div><div class="s">'+(who?esc(who.name):'Chưa giao')+(t.type==='maint'?', ưu tiên '+PRI[t.priority].toLowerCase():'')+'</div></span><span class="pill '+st[1]+'">'+st[0]+'</span></button>';
}
function viewOps(){
  const seg=[['clean','Buồng phòng'],['maint','Bảo trì'],['notes','Bàn giao ca']];
  let h='<h1 class="pt">Vận hành</h1><div class="seg">'+seg.map(s=>'<button class="'+(ui.opsSeg===s[0]?'on':'')+'" data-a="seg" data-s="'+s[0]+'">'+s[1]+'</button>').join('')+'</div><div class="sec" style="margin-top:0">';
  if(ui.opsSeg==='notes'){
    h+='<div class="sec-h"><h2>Ghi chú bàn giao</h2><button class="btn sm" data-a="newNote">'+ic('plus',16)+'Thêm ghi chú</button></div>';
    h+=S.notes.length?'<div class="list">'+S.notes.slice().sort((a,b)=>b.t.localeCompare(a.t)).slice(0,30).map(n=>'<div class="note"><div class="m">'+fmtDT(n.t)+(staffOf(n.by)?', '+esc(staffOf(n.by).name):'')+'</div>'+esc(n.text)+'</div>').join('')+'</div>':'<div class="list"><div class="empty"><b>Chưa có ghi chú</b>Ghi lại những việc ca sau cần biết, ví dụ khách đặc biệt hoặc phòng cần chú ý.</div></div>';
    return h+'</div>';
  }
  const type=ui.opsSeg,list=S.tasks.filter(t=>t.type===type);

  h+='<div class="sec-h"><h2>'+(type==='clean'?'Đang chờ ('+open.length+')':'Chưa xử lý ('+open.length+')')+'</h2><button class="btn sm" data-a="'+(type==='clean'?'newTask':'newIssue')+'">'+ic('plus',16)+(type==='clean'?'Giao việc':'Báo sự cố')+'</button></div>';
  h+=open.length?'<div class="list">'+open.map(taskRow).join('')+'</div>':'<div class="list"><div class="empty"><b>'+(type==='clean'?'Không có phòng chờ dọn':'Không có sự cố')+'</b>'+(type==='clean'?'Khi khách trả phòng, việc dọn phòng sẽ tự động xuất hiện ở đây.':'Nhấn Báo sự cố khi có thiết bị hỏng hoặc phòng cần sửa.')+'</div></div>';
  if(done.length)h+='<div class="sec-h" style="margin-top:22px"><h2>Đã xong gần đây</h2></div><div class="list">'+done.map(taskRow).join('')+'</div>';
  return h+'</div>';

function openTask(id){
  const t=S.tasks.find(x=>x.id===id);if(!t)return;
  const r=roomOf(t.roomId);
  const body='<dl class="kv"><dt>Phòng</dt><dd>'+(r?esc(r.no):'—')+'</dd><dt>Loại việc</dt><dd>'+(t.type==='clean'?'Buồng phòng':'Bảo trì')+'</dd>'+(t.type==='maint'?'<dt>Ưu tiên</dt><dd>'+PRI[t.priority]+'</dd>':'')+'<dt>Tạo lúc</dt><dd>'+fmtDT(t.createdAt)+'</dd></dl>'+(t.note?'<div class="hint" style="margin:8px 0">'+esc(t.note)+'</div>':'')

/* ---- Reports ---- */
function periodDays(){
  const t=today();
  if(ui.rep==='mtd'){const f=t.slice(0,8)+'01',n=diffDays(f,t)+1;return Array.from({length:n},(_,i)=>addDays(f,i));}
  if(ui.rep==='lm'){const d=new Date();const f=new Date(d.getFullYear(),d.getMonth()-1,1),l=new Date(d.getFullYear(),d.getMonth(),0);const fs=ymd(f);return Array.from({length:l.getDate()},(_,i)=>addDays(fs,i));}
  const n=ui.rep;return Array.from({length:n},(_,i)=>addDays(t,i-n+1));
}
function reportData(){
  const days=periodDays(),first=days[0],last=days[days.length-1],total=S.rooms.length;
  const per=days.map(d=>Object.assign({d},dayStats(d,false)));
  const sum=k=>per.reduce((a,x)=>a+x[k],0);
  const room=sum('room'),svc=sum('svc'),sold=sum('sold'),avail=total*days.length;
  const bySrc={},byType={},bySvc={},byPay={};
  const endEx=addDays(last,1);
  for(const b of S.bookings){
    if(b.status==='cancelled')continue;
    const live=b.status==='in'||b.status==='out';
    if(live){
      const a=b.checkIn>first?b.checkIn:first,z=b.checkOut<endEx?b.checkOut:endEx,nights=Math.max(0,diffDays(a,z));
      let rev=nights*b.rate;
      for(const c of b.charges||[])if(c.date>=first&&c.date<=last){const v=c.qty*c.price;rev+=v;bySvc[c.name]=(bySvc[c.name]||0)+v;}
      if(rev>0){const s=b.source||'Khác';bySrc[s]=(bySrc[s]||0)+rev;const ty=typeOf(b.typeId),k=ty?ty.name:'Khác';byType[k]=(byType[k]||0)+rev;}
    }
    for(const p of b.payments||[])if(p.date>=first&&p.date<=last)byPay[p.method]=(byPay[p.method]||0)+p.amount;
  }
  const inRange=S.bookings.filter(b=>b.checkIn>=first&&b.checkIn<=last);
  const cancelled=inRange.filter(b=>b.status==='cancelled').length;
  const made=inRange.length;
  const outs=S.bookings.filter(b=>b.status==='out'&&b.checkOut>=first&&b.checkOut<=last);
  const avgStay=outs.length?outs.reduce((a,b)=>a+Math.max(1,diffDays(b.checkIn,b.checkOut)),0)/outs.length:0;
  return {days,first,last,per,room,svc,rev:room+svc,sold,avail,occ:avail?sold/avail*100:0,adr:sold?room/sold:0,revpar:avail?room/avail:0,bySrc,byType,bySvc,byPay,made,cancelled,cancelRate:made?cancelled/made*100:0,avgStay};
}

    mount:(root,get)=>{

      const rs=$('#f_roomId',root);

      if(!g.guest.trim())return 'Nhập tên khách.';
      if(!g.checkIn||!g.checkOut||g.checkOut<=g.checkIn)return 'Ngày trả phòng phải sau ngày nhận phòng.';
      if(!g.roomId)return 'Chọn một phòng còn trống.';
      if(!roomFree(g.roomId,g.checkIn,g.checkOut,b&&b.id))return 'Phòng đã có khách trong khoảng ngày này.';
      if(g.rate<0)return 'Giá phòng không hợp lệ.';
      if(g.adults<1)return 'Cần ít nhất 1 người lớn.';
      const data={guest:g.guest.trim(),phone:g.phone.trim(),idno:g.idno.trim(),checkIn:g.checkIn,checkOut:g.checkOut,typeId:g.typeId,roomId:g.roomId,adults:g.adults,children:g.children,rate:g.rate,source:g.source,note:g.note.trim()};
      if(b){Object.assign(b,data);logAct('Sửa đặt phòng '+b.code+' của '+b.guest);commit();toast('Đã lưu thay đổi');openBooking(b.id);}
      else{
        const dd=new Date(),code='BK'+String(dd.getFullYear()).slice(2)+pad(dd.getMonth()+1)+pad(dd.getDate())+'-'+Math.random().toString(36).slice(2,5).toUpperCase();
        const nb=Object.assign({id:uid(),code,status:'reserved',charges:[],payments:[],createdAt:nowISO()},data);

        commit();toast('Đã tạo đặt phòng');openBooking(nb.id);
      }
    }});
}
function doCheckIn(id){
  const b=S.bookings.find(x=>x.id===id),r=b&&roomOf(b.roomId);if(!b)return;
  if(!r)return toast('Phòng không còn tồn tại. Hãy sửa đặt phòng.',true);
  if(S.bookings.some(x=>x.id!==b.id&&x.roomId===b.roomId&&x.status==='in'))return toast('Phòng đang có khách khác. Hãy trả phòng trước.',true);
  if(r.status==='maint')return toast('Phòng đang bảo trì, chưa thể nhận khách.',true);
  const go=()=>{
    b.status='in';b.actualIn=nowISO();if(b.checkIn>today())b.checkIn=today();
    if(r.status==='dirty'){r.status='clean';finishCleanTasks(r.id);}
    logAct('Nhận phòng '+r.no+': '+b.guest);commit();openBooking(b.id);toast('Đã nhận phòng '+r.no);
  };
  const step2=()=>{if(r.status==='dirty')confirmBox('Phòng '+r.no+' chưa dọn xong. Vẫn nhận phòng?',go,{label:'Vẫn nhận phòng'});else go();};
  if(b.checkIn>today())confirmBox('Khách đặt đến ngày '+dm(b.checkIn)+'. Nhận phòng sớm từ hôm nay?',step2,{label:'Nhận sớm'});else step2();
}
function openCheckout(id){
  const b0=S.bookings.find(x=>x.id===id);if(!b0)return;
  const t=today();let co=b0.checkOut;
  if(co!==t)co=t>b0.checkIn?t:addDays(b0.checkIn,1);
  const b=Object.assign({},b0,{checkOut:co}),x=calcBill(b);
  let note='';
  if(co<b0.checkOut)note='Khách trả sớm hơn dự kiến, tiền phòng tính đến '+dm(co)+'.';
  else if(co>b0.checkOut)note='Khách ở quá hạn, đã tính thêm đến '+dm(co)+'.';
  const bal=Math.max(0,x.balance);
  const fields=bal>0?[{k:'amount',label:'Số tiền thu (₫)',type:'number',value:bal,half:1},{k:'method',label:'Hình thức',type:'select',options:PAY.map(p=>({v:p,l:p})),value:PAY[0],half:1}]:[];
  openSheet({title:'Trả phòng '+roomNo(b.roomId),body:'<div class="muted" style="font-size:14px">'+esc(b.guest)+', '+dm(b.checkIn)+' đến '+dm(co)+'</div>'+(note?'<div class="sum" style="margin-top:10px">'+esc(note)+'</div>':'')+billHTML(b,false)+(bal>0?'<div class="fgrid" style="margin-top:16px">'+fields.map(fieldHTML).join('')+'</div>':''),
    footer:(bal>0?'<button class="btn ghost" data-a="coNoPay" data-id="'+id+'">Ghi nợ</button>':'')+'<button class="btn block" data-a="coConfirm" data-id="'+id+'">'+(bal>0?'Thu tiền và trả phòng':'Xác nhận trả phòng')+'</button>'});
}
function doCheckOut(id,pay,method){
  const b=S.bookings.find(x=>x.id===id),r=b&&roomOf(b.roomId);if(!b)return;
  const t=today();
  if(b.checkOut!==t)b.checkOut=t>b.checkIn?t:addDays(b.checkIn,1);
  if(pay>0)b.payments.push({id:uid(),amount:pay,method:method||PAY[0],date:t,note:'Thanh toán khi trả phòng'});
  b.status='out';b.actualOut=nowISO();
  if(r){if(r.status!=='maint')r.status='dirty';addCleanTask(r,'Dọn phòng sau trả phòng');}
  const left=calcBill(b).balance;
  logAct('Trả phòng '+(r?r.no:'')+': '+b.guest+(pay>0?', đã thu '+money(pay):'')+(left>0?', còn nợ '+money(left):''));
  commit();openBooking(b.id);toast('Đã trả phòng');
}

function exportFile(filename,text){
  try{
    const mime=filename.endsWith('.csv')?'text/csv;charset=utf-8':(filename.endsWith('.json')?'application/json':'text/plain;charset=utf-8');
    const blob=new Blob([text],{type:mime}),a=document.createElement('a');
    a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);toast('Đã tạo file '+filename);return;
  }catch(e){}
  openSheet({title:'Sao chép nội dung',body:'<div class="hint">Không thể tải file trực tiếp. Hãy sao chép nội dung bên dưới và dán vào một file trên máy của bạn.</div><textarea class="inp" id="expTxt" rows="10" readonly style="margin-top:10px;font-size:13px">'+esc(text)+'</textarea>',footer:'<button class="btn block" id="expCopy">Sao chép</button>'});
  $('#expCopy').onclick=async()=>{const ta=$('#expTxt');ta.select();toast(await copyText(text)?'Đã sao chép':'Hãy giữ và chọn Sao chép',false);};
}
function restoreSheet(){
  openSheet({title:'Khôi phục dữ liệu',body:'<div class="hint">Chọn file sao lưu (.json) đã tải trước đó. Dữ liệu hiện tại sẽ bị thay thế.</div><div class="fld" style="margin-top:12px"><input class="inp" id="rfile" type="file" accept=".json,application/json"></div><div class="fld"><label for="rtxt">Hoặc dán nội dung sao lưu</label><textarea class="inp" id="rtxt" rows="5" placeholder="{...}"></textarea></div><div class="err" id="rerr" hidden></div>',footer:'<button class="btn block" id="rgo">Khôi phục</button>'});
  const apply=txt=>{
    let o;try{o=JSON.parse(txt);}catch(e){return fail('Nội dung không đúng định dạng sao lưu.');}
    if(!o||!Array.isArray(o.rooms)||!Array.isArray(o.bookings)||!o.settings||!Array.isArray(o.roomTypes))return fail('File không phải bản sao lưu của ứng dụng này.');
    confirmBox('Thay thế toàn bộ dữ liệu hiện tại bằng bản sao lưu ('+o.rooms.length+' phòng, '+o.bookings.length+' đặt phòng)?',()=>{S=normalize(o);closeSheet();ui.page=null;ui.sub=null;ui.tab='home';commit();toast('Đã khôi phục dữ liệu');},{label:'Khôi phục',danger:true});
  };
  const fail=m=>{const e=$('#rerr');e.textContent=m;e.hidden=false;toast(m,true);};
  $('#rgo').onclick=()=>{
    const f=$('#rfile').files[0],t=$('#rtxt').value.trim();
    if(f){const fr=new FileReader();fr.onload=()=>apply(String(fr.result));fr.onerror=()=>fail('Không đọc được file.');fr.readAsText(f);}
    else if(t)apply(t);else fail('Hãy chọn file hoặc dán nội dung sao lưu.');
  };
}
function csvReport(){
  const R=reportData(),q=v=>'"'+String(v).replace(/"/g,'""')+'"';
  const rows=[['Ngày','Phòng bán','Công suất (%)','Giá phòng TB','Doanh thu phòng','Doanh thu dịch vụ','Tổng doanh thu']];
  R.per.forEach(p=>rows.push([p.d,p.sold,Math.round(p.occ*10)/10,Math.round(p.adr),p.room,p.svc,p.rev]));
  rows.push(['Tổng',R.sold,Math.round(R.occ*10)/10,Math.round(R.adr),R.room,R.svc,R.rev]);
  return '\uFEFF'+rows.map(r=>r.map(q).join(',')).join('\r\n');
}

  task(d){openTask(d.id);},
  taskDo(d){
    const t=S.tasks.find(x=>x.id===d.id);if(!t)return;
    const as=$('#tk_as');if(as)t.assignee=as.value;
    if(d.do==='del'){confirmBox('Xóa công việc này?',()=>{S.tasks=S.tasks.filter(x=>x.id!==t.id);commit();closeSheet();toast('Đã xóa');},{danger:true,label:'Xóa'});return;}
    if(d.do==='start')t.status='doing';
    if(d.do==='done'){
      t.status='done';t.doneAt=nowISO();const r=roomOf(t.roomId);
      if(r){
        if(t.type==='clean'&&r.status==='dirty'){r.status='clean';finishCleanTasks(r.id);logAct('Phòng '+r.no+' đã dọn xong');}
        if(t.type==='maint'&&r.status==='maint'&&!S.tasks.some(x=>x.type==='maint'&&x.roomId===r.id&&x.status!=='done'&&x.lock)){r.status='clean';logAct('Hoàn tất bảo trì phòng '+r.no);}
      }
    }
    commit();closeSheet();toast(d.do==='done'?'Đã hoàn tất':'Đã lưu');
  },
  entAdd(){entForm(null);},entEdit(d){entForm(d.id);},
  bulkRooms(){bulkRoomsForm();},
  addSource(){formSheet({title:'Thêm nguồn đặt phòng',fields:[{k:'name',label:'Tên nguồn',value:'',ph:'Ví dụ: Traveloka'}],onSubmit:g=>{const n=g.name.trim();if(!n)return 'Nhập tên nguồn.';if(S.settings.sources.indexOf(n)>=0)return 'Nguồn này đã có.';S.settings.sources.push(n);commit();toast('Đã thêm nguồn');}});},
  delSource(d){const s=S.settings.sources[Number(d.i)];confirmBox('Xóa nguồn "'+s+'"? Các đặt phòng cũ vẫn giữ nguyên.',()=>{S.settings.sources.splice(Number(d.i),1);commit();},{danger:true,label:'Xóa'});},
  setHotel(){const h=S.settings.hotel;formSheet({title:'Thông tin khách sạn',fields:[{k:'name',label:'Tên khách sạn',value:h.name||''},{k:'address',label:'Địa chỉ',value:h.address||''},{k:'phone',label:'Số điện thoại',type:'tel',value:h.phone||'',half:1},{k:'taxCode',label:'Mã số thuế',value:h.taxCode||'',half:1},{k:'email',label:'Email',type:'email',value:h.email||''}],
    onSubmit:g=>{if(!g.name.trim())return 'Nhập tên khách sạn.';S.settings.hotel={name:g.name.trim(),address:g.address.trim(),phone:g.phone.trim(),taxCode:g.taxCode.trim(),email:g.email.trim()};commit();toast('Đã lưu thông tin');}});},
  setFees(){const c=S.settings;formSheet({title:'Thuế, phí và giờ',fields:[{k:'taxPct',label:'VAT (%)',type:'number',value:c.taxPct,half:1},{k:'servicePct',label:'Phí phục vụ (%)',type:'number',value:c.servicePct,half:1},{k:'checkin',label:'Giờ nhận phòng',type:'time',value:c.checkin,half:1},{k:'checkout',label:'Giờ trả phòng',type:'time',value:c.checkout,half:1}],
    extraBody:'<div class="sum">VAT và phí phục vụ áp dụng cho hóa đơn của mọi đặt phòng. Báo cáo doanh thu tính trước phí và thuế.</div>',
    onSubmit:g=>{if(g.taxPct<0||g.taxPct>100||g.servicePct<0||g.servicePct>100)return 'Tỷ lệ phải từ 0 đến 100.';Object.assign(S.settings,{taxPct:g.taxPct,servicePct:g.servicePct,checkin:g.checkin||'14:00',checkout:g.checkout||'12:00'});commit();toast('Đã lưu cài đặt');}});},
  theme(d){try{localStorage.setItem('ks.theme',d.v);}catch(e){}render();},
  clearDemo(){confirmBox('Xóa toàn bộ đặt phòng, việc và ghi chú mẫu? Loại phòng, danh sách phòng, giá và nhân viên được giữ lại để bạn chỉnh sửa.',()=>{S.bookings=[];S.tasks=[];S.notes=[];S.log=[];S.rooms.forEach(r=>r.status='clean');S.demo=false;commit();toast('Đã xóa dữ liệu mẫu');},{danger:true,label:'Xóa dữ liệu mẫu'});},
  resetAll(){confirmBox('Xóa toàn bộ dữ liệu trên máy chủ, gồm phòng, giá, đặt phòng và cài đặt? Mọi nhân viên sẽ mất dữ liệu và không thể hoàn tác. Hãy sao lưu trước.',()=>{S=blank();ui.page=null;ui.sub=null;ui.tab='home';commit();toast('Đã đặt lại. Hãy bắt đầu từ Cài đặt.');},{danger:true,label:'Xóa tất cả'});},
  backup(){exportFile('sao-luu-khach-san-'+today()+'.json',JSON.stringify(S,null,1));},
  restore(){restoreSheet();},
  async login(){
    const em=$('#lg_email').value.trim(),pw=$('#lg_pw').value,er=$('#lg_err'),btn=$('#lg_go');
    er.hidden=true;
    if(!em||!pw){er.textContent='Nhập email và mật khẩu.';er.hidden=false;return;}
    btn.disabled=true;btn.textContent='Đang đăng nhập...';
    try{await signInWithEmailAndPassword(auth,em,pw);}
    catch(e){er.textContent=authMsg(e);er.hidden=false;btn.disabled=false;btn.textContent='Đăng nhập';}
  },
  async resetPw(){
    const em=$('#lg_email').value.trim(),er=$('#lg_err');
    if(!em){er.textContent='Nhập email của bạn ở ô phía trên rồi bấm lại.';er.hidden=false;return;}
    try{await sendPasswordResetEmail(auth,em);er.hidden=true;toast('Đã gửi email đặt lại mật khẩu, hãy kiểm tra hộp thư.');}
    catch(e){er.textContent=authMsg(e);er.hidden=false;}
  },
  logout(){confirmBox('Đăng xuất khỏi tài khoản '+ui.user+'?',()=>{closeSheet();signOut(auth);},{label:'Đăng xuất'});},
  reload(){location.reload();},
  setupBlank(){Object.assign(S,blank());ui.auth='app';ui.tab='home';commit();toast('Đã khởi tạo. Hãy thêm phòng trong Cài đặt.');},
  setupDemo(){Object.assign(S,seed());ui.auth='app';ui.tab='home';commit();toast('Đã nạp dữ liệu mẫu');},
  exportCSV(){exportFile('bao-cao-'+dm(periodDays()[0]).replace('/','-')+'.csv',csvReport());}
};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');if(!el)return;
  const fn=A[el.dataset.a];if(fn){e.preventDefault();fn(el.dataset,el,e);}
});
$('#dlg').addEventListener('click',e=>{if(e.target.id==='dlg')A.dlgNo();});
document.addEventListener('input',e=>{if(e.target.id==='q'){ui.q=e.target.value;const c=$('#blist');if(c)c.innerHTML=bookListHTML();}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.target.id==='lg_email'||e.target.id==='lg_pw')){A.login();return;}if(e.key==='Escape'){if($('#dlg').classList.contains('on'))A.dlgNo();else if(sheetOpen)closeSheet();}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!sheetOpen&&ui.auth==='app')render();});
window.addEventListener('online',()=>{ui.online=true;renderTopSafe();});
window.addEventListener('offline',()=>{ui.online=false;renderTopSafe();});

initAuth();
})();
</script>
</body>
</html>
